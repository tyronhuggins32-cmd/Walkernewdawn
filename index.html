<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>
<title>Walker: New Dawn</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101214;
    font-family: Arial, sans-serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
}

#hud {
    position: fixed;
    left: 14px;
    top: 12px;
    color: #eeeeea;
    text-shadow: 2px 2px #000;
    pointer-events: none;
}

#title {
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 1px;
}

#area {
    margin-top: 3px;
    font-size: 11px;
    color: #bbb8aa;
}

#staminaOuter {
    margin-top: 8px;
    width: 155px;
    height: 9px;
    background: #202224;
    border: 2px solid #090a0b;
}

#stamina {
    width: 100%;
    height: 100%;
    background: #aaa770;
}

#controls {
    position: fixed;
    left: 14px;
    bottom: 12px;
    color: #ccc8bb;
    font-size: 11px;
    pointer-events: none;
}

#joystick {
    display: none;
    position: fixed;
    left: 20px;
    bottom: 24px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.06);
}

#stick {
    position: absolute;
    width: 42px;
    height: 42px;
    left: 39px;
    top: 39px;
    border-radius: 50%;
    background: rgba(255,255,255,.25);
}

#sprint {
    display: none;
    position: fixed;
    right: 26px;
    bottom: 35px;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08);
    color: white;
    font-size: 11px;
    font-weight: bold;
    align-items: center;
    justify-content: center;
    user-select: none;
}

@media(pointer: coarse) {
    #joystick {
        display: block;
    }

    #sprint {
        display: flex;
    }

    #controls {
        display: none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="title">WALKER: NEW DAWN</div>
    <div id="area">NEW DAWN CITY</div>

    <div id="staminaOuter">
        <div id="stamina"></div>
    </div>
</div>

<div id="controls">
    WASD / ARROWS • SHIFT TO SPRINT
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="sprint">SPRINT</div>

<script>
"use strict";

/* ============================================================
   CANVAS
============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const staminaBar = document.getElementById("stamina");
const areaLabel = document.getElementById("area");

let screenWidth = innerWidth;
let screenHeight = innerHeight;

function resize() {
    screenWidth = innerWidth;
    screenHeight = innerHeight;

    const dpr = Math.min(2, devicePixelRatio || 1);

    canvas.width = Math.floor(screenWidth * dpr);
    canvas.height = Math.floor(screenHeight * dpr);

    canvas.style.width = screenWidth + "px";
    canvas.style.height = screenHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
}

addEventListener("resize", resize);
resize();

/* ============================================================
   WORLD SETTINGS
============================================================ */

const TILE = 24;

/*
    Each procedural chunk is one large city block
    plus the streets bordering it.
*/

const CHUNK_TILES = 48;

/*
    10 tiles = 240px wide streets.

    Much wider than before.
*/

const ROAD_TILES = 10;

const SIDEWALK_TILES = 2;

const CHUNK_WORLD_SIZE =
    CHUNK_TILES * TILE;

const BUILD_MIN =
    ROAD_TILES + SIDEWALK_TILES;

const BUILD_MAX =
    CHUNK_TILES - SIDEWALK_TILES;

const WORLD_SEED = 781933;

const chunks = new Map();

/* ============================================================
   COLORS
============================================================ */

const COLORS = {
    road: "#1b1d1e",

    sidewalkA: "#62615b",
    sidewalkB: "#5b5a55",

    emptyLot: "#343633",

    grassA: "#263b27",
    grassB: "#2b422b",

    dirt: "#4b4337",
    gravel: "#424340",

    parking: "#292b2c",

    floorHouse: "#716758",
    floorApartment: "#68625a",
    floorStore: "#666155",
    floorClinic: "#626761",
    floorOffice: "#5b6162",
    floorWarehouse: "#515456",

    wallBrick: "#463d36",
    wallConcrete: "#454746",
    wallLight: "#56544e",

    window: "#729194",
    door: "#76543b",

    shelf: "#594837",
    counter: "#514334",
    bed: "#74685c",
    sofa: "#5f554c",
    table: "#604b39",
    desk: "#544638",

    fence: "#797b74"
};

/* ============================================================
   PLAYER
============================================================ */

const player = {
    x: TILE * (ROAD_TILES / 2),
    y: TILE * (ROAD_TILES / 2),

    width: 14,
    height: 20,

    walkSpeed: 155,
    sprintSpeed: 235,

    stamina: 100,
    maxStamina: 100,

    facing: "down",
    moving: false
};

const camera = {
    x: player.x,
    y: player.y
};

/* ============================================================
   INPUT
============================================================ */

const keys = {};

addEventListener("keydown", event => {
    keys[event.key.toLowerCase()] = true;
});

addEventListener("keyup", event => {
    keys[event.key.toLowerCase()] = false;
});

/* ============================================================
   MOBILE CONTROLS
============================================================ */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const sprintButton = document.getElementById("sprint");

let joystickPointer = null;

let joyX = 0;
let joyY = 0;

let sprintTouch = false;

joystick.addEventListener("pointerdown", event => {
    joystickPointer = event.pointerId;

    joystick.setPointerCapture(
        event.pointerId
    );

    updateJoystick(event);
});

joystick.addEventListener("pointermove", event => {
    if (event.pointerId !== joystickPointer)
        return;

    updateJoystick(event);
});

joystick.addEventListener("pointerup", releaseJoystick);
joystick.addEventListener("pointercancel", releaseJoystick);

function releaseJoystick(event) {
    if (
        joystickPointer !== null &&
        event.pointerId !== joystickPointer
    ) return;

    joystickPointer = null;

    joyX = 0;
    joyY = 0;

    stick.style.transform =
        "translate(0px,0px)";
}

function updateJoystick(event) {
    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    let dx =
        event.clientX - centerX;

    let dy =
        event.clientY - centerY;

    const maximum = 38;

    const distance =
        Math.hypot(dx, dy);

    if (distance > maximum) {
        dx =
            dx / distance * maximum;

        dy =
            dy / distance * maximum;
    }

    joyX = dx / maximum;
    joyY = dy / maximum;

    stick.style.transform =
        `translate(${dx}px,${dy}px)`;
}

sprintButton.addEventListener("pointerdown", event => {
    sprintTouch = true;

    sprintButton.setPointerCapture(
        event.pointerId
    );
});

sprintButton.addEventListener("pointerup", () => {
    sprintTouch = false;
});

sprintButton.addEventListener("pointercancel", () => {
    sprintTouch = false;
});

/* ============================================================
   DETERMINISTIC RANDOM
============================================================ */

function hash(x, y, extra = 0) {
    let h =
        WORLD_SEED ^
        Math.imul(x, 374761393) ^
        Math.imul(y, 668265263) ^
        Math.imul(extra, 1442695041);

    h =
        Math.imul(
            h ^ (h >>> 13),
            1274126177
        );

    return (h ^ (h >>> 16)) >>> 0;
}

function rand(x, y, extra = 0) {
    return (
        hash(x, y, extra) /
        4294967295
    );
}

function randInt(
    x,
    y,
    extra,
    minimum,
    maximum
) {
    return (
        minimum +
        Math.floor(
            rand(x, y, extra) *
            (maximum - minimum + 1)
        )
    );
}

function choose(
    x,
    y,
    extra,
    array
) {
    return array[
        hash(x, y, extra) %
        array.length
    ];
}

/* ============================================================
   CHUNK HELPERS
============================================================ */

function chunkKey(cx, cy) {
    return cx + "," + cy;
}

function tileIndex(x, y) {
    return y * CHUNK_TILES + x;
}

function validLocalTile(x, y) {
    return (
        x >= 0 &&
        y >= 0 &&
        x < CHUNK_TILES &&
        y < CHUNK_TILES
    );
}

function setGround(chunk, x, y, type) {
    if (!validLocalTile(x, y))
        return;

    chunk.ground[
        tileIndex(x, y)
    ] = type;
}

function setOverlay(chunk, x, y, type) {
    if (!validLocalTile(x, y))
        return;

    chunk.overlay[
        tileIndex(x, y)
    ] = type;
}

function makeSolid(chunk, x, y, solid = true) {
    const key = x + "," + y;

    if (solid)
        chunk.solid.add(key);
    else
        chunk.solid.delete(key);
}

function makeWall(chunk, x, y, type) {
    setOverlay(chunk, x, y, type);
    makeSolid(chunk, x, y, true);
}

function makeWindow(chunk, x, y, direction) {
    setOverlay(
        chunk,
        x,
        y,
        direction === "horizontal"
            ? "windowH"
            : "windowV"
    );

    makeSolid(chunk, x, y, true);
}

function makeDoor(chunk, x, y) {
    setOverlay(chunk, x, y, "door");
    makeSolid(chunk, x, y, false);
}

function addProp(
    chunk,
    kind,
    x,
    y,
    solid = false
) {
    chunk.props.push({
        kind,
        x,
        y
    });

    if (solid)
        makeSolid(chunk, x, y, true);
}

/* ============================================================
   CREATE CHUNK
============================================================ */

function getChunk(cx, cy) {
    const key =
        chunkKey(cx, cy);

    if (!chunks.has(key)) {
        chunks.set(
            key,
            generateChunk(cx, cy)
        );
    }

    return chunks.get(key);
}

function generateChunk(cx, cy) {
    const chunk = {
        cx,
        cy,

        district: "residential",

        ground:
            new Array(
                CHUNK_TILES *
                CHUNK_TILES
            ).fill("empty"),

        overlay:
            new Array(
                CHUNK_TILES *
                CHUNK_TILES
            ).fill(null),

        solid:
            new Set(),

        props: []
    };

    generateBaseTerrain(chunk);

    const roll =
        rand(cx, cy, 10);

    if (roll < 0.10)
        chunk.district = "park";

    else if (roll < 0.17)
        chunk.district = "parking";

    else if (roll < 0.31)
        chunk.district = "industrial";

    else if (roll < 0.59)
        chunk.district = "commercial";

    else if (roll < 0.68)
        chunk.district = "civic";

    else
        chunk.district = "residential";

    switch (chunk.district) {
        case "park":
            generatePark(chunk);
            break;

        case "parking":
            generateParkingLot(chunk);
            break;

        case "industrial":
            generateIndustrialBlock(chunk);
            break;

        case "commercial":
            generateCommercialBlock(chunk);
            break;

        case "civic":
            generateCivicBlock(chunk);
            break;

        default:
            generateResidentialBlock(chunk);
            break;
    }

    addStreetFurniture(chunk);

    return chunk;
}

/* ============================================================
   ROADS + SIDEWALKS
============================================================ */

function generateBaseTerrain(chunk) {
    for (
        let y = 0;
        y < CHUNK_TILES;
        y++
    ) {
        for (
            let x = 0;
            x < CHUNK_TILES;
            x++
        ) {
            if (
                x < ROAD_TILES ||
                y < ROAD_TILES
            ) {
                setGround(
                    chunk,
                    x,
                    y,
                    "road"
                );
            }

            else if (
                x <
                    ROAD_TILES +
                    SIDEWALK_TILES ||

                y <
                    ROAD_TILES +
                    SIDEWALK_TILES ||

                x >=
                    CHUNK_TILES -
                    SIDEWALK_TILES ||

                y >=
                    CHUNK_TILES -
                    SIDEWALK_TILES
            ) {
                setGround(
                    chunk,
                    x,
                    y,
                    "sidewalk"
                );
            }

            else {
                setGround(
                    chunk,
                    x,
                    y,
                    "empty"
                );
            }
        }
    }
}

/* ============================================================
   LOT HELPERS
============================================================ */

function lotRect(
    x,
    y,
    width,
    height
) {
    return {
        x,
        y,
        w: width,
        h: height
    };
}

function insetLot(lot, amount) {
    return {
        x: lot.x + amount,
        y: lot.y + amount,

        w: lot.w - amount * 2,
        h: lot.h - amount * 2
    };
}

/* ============================================================
   RESIDENTIAL BLOCK
============================================================ */

function generateResidentialBlock(chunk) {
    const cx = chunk.cx;
    const cy = chunk.cy;

    const columns =
        rand(cx, cy, 40) > .55
            ? 3
            : 2;

    const rows = 2;

    const width =
        BUILD_MAX - BUILD_MIN;

    const lotWidth =
        Math.floor(width / columns);

    const lotHeight =
        Math.floor(width / rows);

    let id = 0;

    for (
        let gx = 0;
        gx < columns;
        gx++
    ) {
        for (
            let gy = 0;
            gy < rows;
            gy++
        ) {
            id++;

            const lot = lotRect(
                BUILD_MIN +
                    gx * lotWidth,

                BUILD_MIN +
                    gy * lotHeight,

                lotWidth,
                lotHeight
            );

            if (
                rand(
                    cx,
                    cy,
                    100 + id
                ) < .08
            ) {
                generateBackyard(
                    chunk,
                    lot,
                    id
                );

                continue;
            }

            const buildingType =
                choose(
                    cx,
                    cy,
                    200 + id,
                    [
                        "house",
                        "house",
                        "rowhouse",
                        "apartment"
                    ]
                );

            const building =
                insetLot(
                    lot,
                    1
                );

            placeBuilding(
                chunk,
                building,
                buildingType,
                id
            );
        }
    }
}

/* ============================================================
   COMMERCIAL BLOCK
============================================================ */

function generateCommercialBlock(chunk) {
    const cx = chunk.cx;
    const cy = chunk.cy;

    const width =
        BUILD_MAX -
        BUILD_MIN;

    const lotWidth =
        Math.floor(width / 2);

    const lotHeight =
        Math.floor(width / 2);

    let id = 0;

    for (let gx = 0; gx < 2; gx++) {
        for (let gy = 0; gy < 2; gy++) {
            id++;

            const lot =
                lotRect(
                    BUILD_MIN +
                        gx * lotWidth,

                    BUILD_MIN +
                        gy * lotHeight,

                    lotWidth,
                    lotHeight
                );

            const type =
                choose(
                    cx,
                    cy,
                    400 + id,
                    [
                        "store",
                        "store",
                        "pharmacy",
                        "diner",
                        "office"
                    ]
                );

            placeBuilding(
                chunk,
                insetLot(lot, 1),
                type,
                id
            );
        }
    }
}

/* ============================================================
   INDUSTRIAL BLOCK
============================================================ */

function generateIndustrialBlock(chunk) {
    const split =
        rand(
            chunk.cx,
            chunk.cy,
            500
        ) > .45;

    const width =
        BUILD_MAX -
        BUILD_MIN;

    if (split) {
        const half =
            Math.floor(width / 2);

        placeBuilding(
            chunk,

            {
                x: BUILD_MIN + 1,
                y: BUILD_MIN + 1,
                w: half - 2,
                h: width - 2
            },

            "warehouse",
            1
        );

        generateServiceYard(
            chunk,

            {
                x:
                    BUILD_MIN +
                    half,

                y:
                    BUILD_MIN,

                w:
                    width -
                    half,

                h:
                    width
            },

            2
        );
    }

    else {
        placeBuilding(
            chunk,

            {
                x: BUILD_MIN + 2,
                y: BUILD_MIN + 2,

                w: width - 4,
                h:
                    Math.floor(
                        width * .60
                    )
            },

            "warehouse",
            1
        );

        generateServiceYard(
            chunk,

            {
                x: BUILD_MIN,
                y:
                    BUILD_MIN +
                    Math.floor(
                        width * .63
                    ),

                w: width,
                h:
                    Math.floor(
                        width * .37
                    )
            },

            2
        );
    }
}

/* ============================================================
   CIVIC BLOCK
============================================================ */

function generateCivicBlock(chunk) {
    const width =
        BUILD_MAX -
        BUILD_MIN;

    const type =
        choose(
            chunk.cx,
            chunk.cy,
            600,
            [
                "clinic",
                "office",
                "clinic"
            ]
        );

    placeBuilding(
        chunk,

        {
            x: BUILD_MIN + 4,
            y: BUILD_MIN + 4,
            w: width - 8,
            h: width - 8
        },

        type,
        1
    );
}

/* ============================================================
   BUILDING
============================================================ */

function placeBuilding(
    chunk,
    rect,
    type,
    id
) {
    if (
        rect.w < 7 ||
        rect.h < 7
    )
        return;

    const floorType =
        getFloorForBuilding(type);

    const wallType =
        getWallForBuilding(type);

    /*
        Floor
    */

    for (
        let y = rect.y + 1;
        y < rect.y + rect.h - 1;
        y++
    ) {
        for (
            let x = rect.x + 1;
            x < rect.x + rect.w - 1;
            x++
        ) {
            setGround(
                chunk,
                x,
                y,
                floorType
            );
        }
    }

    /*
        Outer walls
    */

    for (
        let x = rect.x;
        x < rect.x + rect.w;
        x++
    ) {
        makeWall(
            chunk,
            x,
            rect.y,
            wallType
        );

        makeWall(
            chunk,
            x,
            rect.y + rect.h - 1,
            wallType
        );
    }

    for (
        let y = rect.y;
        y < rect.y + rect.h;
        y++
    ) {
        makeWall(
            chunk,
            rect.x,
            y,
            wallType
        );

        makeWall(
            chunk,
            rect.x + rect.w - 1,
            y,
            wallType
        );
    }

    /*
        Pick a street-facing side.
    */

    let entranceSide;

    const centerX =
        rect.x +
        rect.w / 2;

    const centerY =
        rect.y +
        rect.h / 2;

    const distanceTop =
        centerY -
        BUILD_MIN;

    const distanceLeft =
        centerX -
        BUILD_MIN;

    const distanceRight =
        BUILD_MAX -
        centerX;

    const distanceBottom =
        BUILD_MAX -
        centerY;

    const minimum =
        Math.min(
            distanceTop,
            distanceLeft,
            distanceRight,
            distanceBottom
        );

    if (minimum === distanceTop)
        entranceSide = "top";

    else if (minimum === distanceLeft)
        entranceSide = "left";

    else if (minimum === distanceRight)
        entranceSide = "right";

    else
        entranceSide = "bottom";

    const door =
        addExteriorDoor(
            chunk,
            rect,
            entranceSide
        );

    addWindows(
        chunk,
        rect,
        entranceSide
    );

    /*
        Building-specific interior.
    */

    switch (type) {
        case "house":
        case "rowhouse":
        case "apartment":
            createHomeInterior(
                chunk,
                rect,
                wallType
            );
            break;

        case "store":
        case "pharmacy":
            createStoreInterior(
                chunk,
                rect,
                type,
                wallType
            );
            break;

        case "diner":
            createDinerInterior(
                chunk,
                rect,
                wallType
            );
            break;

        case "warehouse":
            createWarehouseInterior(
                chunk,
                rect,
                wallType
            );
            break;

        case "clinic":
            createClinicInterior(
                chunk,
                rect,
                wallType
            );
            break;

        case "office":
            createOfficeInterior(
                chunk,
                rect,
                wallType
            );
            break;
    }

    /*
        Small awning/sign marker.
        No giant text labels.
    */

    if (
        type === "store" ||
        type === "pharmacy" ||
        type === "diner"
    ) {
        chunk.props.push({
            kind: "awning",
            x: door.x,
            y: door.y
        });
    }
}

function getFloorForBuilding(type) {
    switch (type) {
        case "house":
        case "rowhouse":
            return "floorHouse";

        case "apartment":
            return "floorApartment";

        case "store":
        case "pharmacy":
        case "diner":
            return "floorStore";

        case "clinic":
            return "floorClinic";

        case "warehouse":
            return "floorWarehouse";

        default:
            return "floorOffice";
    }
}

function getWallForBuilding(type) {
    switch (type) {
        case "house":
        case "rowhouse":
        case "apartment":
            return "wallBrick";

        case "warehouse":
            return "wallConcrete";

        default:
            return "wallLight";
    }
}

/* ============================================================
   EXTERIOR DOOR
============================================================ */

function addExteriorDoor(
    chunk,
    rect,
    side
) {
    let x;
    let y;

    if (side === "top") {
        x =
            rect.x +
            Math.floor(
                rect.w / 2
            );

        y = rect.y;
    }

    else if (side === "bottom") {
        x =
            rect.x +
            Math.floor(
                rect.w / 2
            );

        y =
            rect.y +
            rect.h -
            1;
    }

    else if (side === "left") {
        x = rect.x;

        y =
            rect.y +
            Math.floor(
                rect.h / 2
            );
    }

    else {
        x =
            rect.x +
            rect.w -
            1;

        y =
            rect.y +
            Math.floor(
                rect.h / 2
            );
    }

    makeDoor(
        chunk,
        x,
        y
    );

    return {
        x,
        y
    };
}

/* ============================================================
   WINDOWS
============================================================ */

function addWindows(
    chunk,
    rect,
    entranceSide
) {
    for (
        let x = rect.x + 2;
        x < rect.x + rect.w - 2;
        x += 3
    ) {
        if (
            entranceSide !== "top" ||
            x !==
                rect.x +
                Math.floor(
                    rect.w / 2
                )
        ) {
            makeWindow(
                chunk,
                x,
                rect.y,
                "horizontal"
            );
        }

        if (
            entranceSide !== "bottom" ||
            x !==
                rect.x +
                Math.floor(
                    rect.w / 2
                )
        ) {
            makeWindow(
                chunk,
                x,
                rect.y + rect.h - 1,
                "horizontal"
            );
        }
    }

    for (
        let y = rect.y + 2;
        y < rect.y + rect.h - 2;
        y += 3
    ) {
        if (
            entranceSide !== "left" ||
            y !==
                rect.y +
                Math.floor(
                    rect.h / 2
                )
        ) {
            makeWindow(
                chunk,
                rect.x,
                y,
                "vertical"
            );
        }

        if (
            entranceSide !== "right" ||
            y !==
                rect.y +
                Math.floor(
                    rect.h / 2
                )
        ) {
            makeWindow(
                chunk,
                rect.x + rect.w - 1,
                y,
                "vertical"
            );
        }
    }
}

/* ============================================================
   PARTITIONS
============================================================ */

function verticalPartition(
    chunk,
    x,
    y1,
    y2,
    gapY,
    wallType
) {
    for (
        let y = y1;
        y <= y2;
        y++
    ) {
        if (y === gapY) {
            makeDoor(
                chunk,
                x,
                y
            );

            continue;
        }

        makeWall(
            chunk,
            x,
            y,
            wallType
        );
    }
}

function horizontalPartition(
    chunk,
    y,
    x1,
    x2,
    gapX,
    wallType
) {
    for (
        let x = x1;
        x <= x2;
        x++
    ) {
        if (x === gapX) {
            makeDoor(
                chunk,
                x,
                y
            );

            continue;
        }

        makeWall(
            chunk,
            x,
            y,
            wallType
        );
    }
}

function generateBackyard(

    lot,
    id
) {
    for (
        let y = lot.y;
        y < lot.y + lot.h;
        y++
    ) {
        for (
            let x = lot.x;
            x < lot.x + lot.w;
            x++
        ) {
            setGround(
                chunk,
                x,
                y,
                "grass"
            );
        }
    }

    /*
        Fence with gap.
    */

    const gateX =
        lot.x +
        Math.floor(
            lot.w / 2
        );

    for (
        let x = lot.x;
        x < lot.x + lot.w;
        x++
    ) {
        if (x !== gateX) {
            makeWall(
                chunk,
                x,
                lot.y,
                "fence"
            );
        }
    }

    for (
        let y = lot.y;
        y < lot.y + lot.h;
        y++
    ) {
        makeWall(
            chunk,
            lot.x,
            y,
            "fence"
        );

        makeWall(
            chunk,
            lot.x + lot.w - 1,
            y,
            "fence"
        );
    }

    addProp(
        chunk,
        "tree",
        lot.x + 2,
        lot.y + 3,

    addProp(
        chunk,

        lot.x + lot.w - 3,

============================================================ */

function generatePark(chunk) {
    for (
        let y = BUILD_MIN;
        y < BUILD_MAX;

    ) {
        for (
            let x = BUILD_MIN;
            x < BUILD_MAX;
            x++
        ) {
            setGround(
                chunk,
                x,
                y,
                "grass"
            );
        }
    }

    const center =
        Math.floor(
            (
                BUILD_MIN +
                BUILD_MAX
            ) /
            2
        );

    /*
        Park paths.
    */

    for (
        let i = BUILD_MIN;
        i < BUILD_MAX;
        i++
    ) {
        setGround(
            chunk,
            center,
            i,
            "dirt"
        );

        setGround(
            chunk,
            center + 1,
            i,
            "dirt"
        );

        setGround(
            chunk,
            i,
            center,
            "dirt"
        );

        setGround(
            chunk,
            i,
            center + 1,
            "dirt"
        );
    }

    for (
        let i = 0;
        i < 24;
        i++
    ) {
        const x =
            randInt(
                chunk.cx,
                chunk.cy,
                800 + i,
                BUILD_MIN + 2,
                BUILD_MAX - 3
            );

        const y =
            randInt(
                chunk.cx,
                chunk.cy,
                900 + i,
                BUILD_MIN + 2,
                BUILD_MAX - 3
            );

        if (
            Math.abs(
                x - center
            ) < 3 ||

            Math.abs(
                y - center
            ) < 3
        ) continue;

        addProp(
            chunk,
            "tree",
            x,
            y,
            true
        );
    }

    addProp(
        chunk,
        "bench",
        center - 3,
        center - 2,
        true
    );

    addProp(

        "bench",
        center + 3,
        center + 3,
        true
    );

/* ============================================================
   COLLISION
============================================================ */

function positiveMod(value, divisor) {
    return (
        (value % divisor) +
        divisor
    ) % divisor;
}

function isSolidTile(globalTileX, globalTileY) {
    const cx =
        Math.floor(
            globalTileX /
            CHUNK_TILES
        );

    const cy =
        Math.floor(
            globalTileY /
            CHUNK_TILES
        );

    const localX =
        positiveMod(
            globalTileX,
            CHUNK_TILES
        );

    const localY =
        positiveMod(
            globalTileY,
            CHUNK_TILES
        );

    const chunk =
        getChunk(cx, cy);

    return chunk.solid.has(
        localX + "," + localY
    );
}

function solidAtPixel(x, y) {
    const tx =
        Math.floor(
            x / TILE
        );

    const ty =
        Math.floor(
            y / TILE
        );

    return isSolidTile(
        tx,
        ty
    );
}

function canMoveTo(x, y) {
    const halfW =
        player.width / 2;

    const halfH =
        player.height / 2;

    const points = [
        [
            x - halfW,
            y - halfH
        ],

        [
            x + halfW,
            y - halfH
        ],

        [
            x - halfW,
            y + halfH
        ],

        [
            x + halfW,
            y + halfH
        ]
    ];

    for (
        const point
        of points
    ) {
        if (
            solidAtPixel(
                point[0],
                point[1]
            )
        )
            return false;
    }

    return true;
}

/* ============================================================
   PLAYER UPDATE
============================================================ */

function updatePlayer(dt) {
    let dx = 0;
    let dy = 0;

    if (
        keys["w"] ||
        keys["arrowup"]
    )
        dy -= 1;

    if (
        keys["s"] ||
        keys["arrowdown"]
    )
        dy += 1;

    if (
        keys["a"] ||
        keys["arrowleft"]
    )
        dx -= 1;

    if (
        keys["d"] ||
        keys["arrowright"]
    )
        dx += 1;

    dx += joyX;
    dy += joyY;

    const magnitude =
        Math.hypot(dx, dy);

    player.moving =
        magnitude > .05;

    if (magnitude > 1) {
        dx /= magnitude;
        dy /= magnitude;
    }

    if (
        Math.abs(dx) >
        Math.abs(dy)
    ) {
        if (dx > .05)
            player.facing = "right";

        else if (dx < -.05)
            player.facing = "left";
    }

    else {
        if (dy > .05)
            player.facing = "down";

        else if (dy < -.05)
            player.facing = "up";
    }

    const sprinting =
        (
            keys["shift"] ||
            sprintTouch
        ) &&
        player.moving &&
        player.stamina > 0;

    const speed =
        sprinting
            ? player.sprintSpeed
            : player.walkSpeed;

    if (sprinting) {
        player.stamina -=
            23 * dt;
    }

    else {
        player.stamina +=
            13 * dt;
    }

    player.stamina =
        Math.max(
            0,
            Math.min(
                player.maxStamina,
                player.stamina
            )
        );

    const nextX =
        player.x +
        dx *
        speed *
        dt;

    if (
        canMoveTo(
            nextX,
            player.y
        )
    ) {
        player.x =
            nextX;
    }

    const nextY =
        player.y +
        dy *
        speed *
        dt;

    if (
        canMoveTo(
            player.x,
            nextY
        )
    ) {
        player.y =
            nextY;
    }

    staminaBar.style.width =
        (
            player.stamina /
            player.maxStamina *
            100
        ) + "%";

    updateAreaLabel();
}

function updateAreaLabel() {
    const cx =
        Math.floor(
            player.x /
            CHUNK_WORLD_SIZE
        );

    const cy =
        Math.floor(
            player.y /
            CHUNK_WORLD_SIZE
        );

    const chunk =
        getChunk(cx, cy);

    areaLabel.textContent =
        "NEW DAWN CITY • " +
        chunk.district.toUpperCase();
}

/* ============================================================
   CAMERA
============================================================ */

function updateCamera(dt) {
    const follow =
        Math.min(
            1,
            dt * 8
        );

    camera.x +=
        (
            player.x -
            camera.x
        ) *
        follow;

    camera.y +=
        (
            player.y -
            camera.y
        ) *
        follow;
}

/* ============================================================
   SCREEN HELPERS
============================================================ */

function screenX(worldX) {
    return (
        worldX -
        camera.x +
        screenWidth / 2
    );
}

function screenY(worldY) {
    return (
        worldY -
        camera.y +
        screenHeight / 2
    );
}

/* ============================================================
   DRAW WORLD
============================================================ */

function drawWorld() {
    ctx.fillStyle = "#101214";

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );

    const centerChunkX =
        Math.floor(
            camera.x /
            CHUNK_WORLD_SIZE
        );

    const centerChunkY =
        Math.floor(
            camera.y /
            CHUNK_WORLD_SIZE
        );

    /*
        3x3 chunks is plenty because
        each chunk is now huge.
    */

    for (
        let cy =
            centerChunkY - 1;

        cy <=
            centerChunkY + 1;

        cy++
    ) {
        for (
            let cx =
                centerChunkX - 1;

            cx <=
                centerChunkX + 1;

            cx++
        ) {
            drawChunk(
                getChunk(cx, cy)
            );
        }
    }

    drawPlayer();
}

/* ============================================================
   DRAW CHUNK
============================================================ */

function drawChunk(chunk) {
    const originX =
        chunk.cx *
        CHUNK_WORLD_SIZE;

    const originY =
        chunk.cy *
        CHUNK_WORLD_SIZE;

    for (
        let y = 0;
        y < CHUNK_TILES;
        y++
    ) {
        for (
            let x = 0;
            x < CHUNK_TILES;
            x++
        ) {
            const worldX =
                originX +
                x * TILE;

            const worldY =
                originY +
                y * TILE;

            const sx =
                screenX(worldX);

            const sy =
                screenY(worldY);

            if (
                sx < -TILE ||
                sy < -TILE ||
                sx >
                    screenWidth +
                    TILE ||

                sy >
                    screenHeight +
                    TILE
            )
                continue;

            const ground =
                chunk.ground[
                    tileIndex(x, y)
                ];

            drawGroundTile(
                ground,
                sx,
                sy,
                x,
                y,
                chunk
            );
        }
    }

    /*
        Buildings / walls.
    */

    for (
        let y = 0;
        y < CHUNK_TILES;
        y++
    ) {
        for (
            let x = 0;
            x < CHUNK_TILES;
            x++
        ) {
            const overlay =
                chunk.overlay[
                    tileIndex(x, y)
                ];

            if (!overlay)
                continue;

            const sx =
                screenX(
                    originX +
                    x * TILE
                );

            const sy =
                screenY(
                    originY +
                    y * TILE
                );

            if (
                sx < -TILE ||
                sy < -TILE ||
                sx >
                    screenWidth +
                    TILE ||

                sy >
                    screenHeight +
                    TILE
            )
                continue;

            drawOverlayTile(
                overlay,
                sx,
                sy
            );
        }
    }

    /*
        Furniture / vehicles / trees.
    */

    for (
        const prop
        of chunk.props
    ) {
        drawProp(
            prop,
            originX,
            originY
        );
    }
}

/* ============================================================
   GROUND TILES
============================================================ */

function drawGroundTile(
    type,
    sx,
    sy,
    lx,
    ly,
    chunk
) {
    const gx =
        chunk.cx *
        CHUNK_TILES +
        lx;

    const gy =
        chunk.cy *
        CHUNK_TILES +
        ly;

    if (type === "road") {
        ctx.fillStyle =
            COLORS.road;

        ctx.fillRect(
            sx,
            sy,
            TILE + 1,
            TILE + 1
        );

        /*
            Grit / road patches.
        */

        if (
            hash(
                gx,
                gy,
                4000
            ) % 13 === 0
        ) {
            ctx.fillStyle =
                "#242627";

            ctx.fillRect(
                sx + 4,
                sy + 7,
                10,
                3
            );
        }

        drawRoadMarkings(
            sx,
            sy,
            lx,
            ly,
            gx,
            gy
        );

        return;
    }

    if (type === "sidewalk") {
        ctx.fillStyle =
            (
                gx + gy
            ) % 2 === 0
                ? COLORS.sidewalkA
                : COLORS.sidewalkB;

        ctx.fillRect(
            sx,
            sy,
            TILE + 1,
            TILE + 1
        );

        ctx.strokeStyle =
            "rgba(20,20,20,.16)";

        ctx.lineWidth = 1;

        ctx.strokeRect(
            sx,
            sy,
            TILE,
            TILE
        );

        return;
    }

    if (type === "grass") {
        ctx.fillStyle =
            hash(
                gx,
                gy,
                5000
            ) % 2 === 0
                ? COLORS.grassA
                : COLORS.grassB;

        ctx.fillRect(
            sx,
            sy,
            TILE + 1,
            TILE + 1
        );

        return;
    }

    const groundColors = {
        empty:
            COLORS.emptyLot,

        dirt:
            COLORS.dirt,

        gravel:
            COLORS.gravel,

        parking:
            COLORS.parking,

        floorHouse:
            COLORS.floorHouse,

        floorApartment:
            COLORS.floorApartment,

        floorStore:
            COLORS.floorStore,

        floorClinic:
            COLORS.floorClinic,

        floorOffice:
            COLORS.floorOffice,

        floorWarehouse:
            COLORS.floorWarehouse
    };

    ctx.fillStyle =
        groundColors[type] ||
        COLORS.emptyLot;

    ctx.fillRect(
        sx,
        sy,
        TILE + 1,
        TILE + 1
    );

    /*
        Floor tile seams inside buildings.
    */

    if (
        type.startsWith("floor")
    ) {
        ctx.strokeStyle =
            "rgba(20,20,20,.09)";

        ctx.strokeRect(
            sx,
            sy,
            TILE,
            TILE
        );
    }

    /*
        Parking lines.
    */

    if (
        type === "parking" &&
        gx % 5 === 0
    ) {
        ctx.fillStyle =
            "#8b8876";

        ctx.fillRect(
            sx + 2,
            sy,
            2,
            TILE
        );
    }
}

/* ============================================================
   ROAD MARKINGS
============================================================ */

function drawRoadMarkings(
    sx,
    sy,
    lx,
    ly,
    gx,
    gy
) {
    const center =
        ROAD_TILES / 2;

    /*
        Intersection itself remains mostly clean.
    */

    const intersection =
        lx < ROAD_TILES &&
        ly < ROAD_TILES;

    if (intersection) {
        /*
            Crosswalk stripes.
        */

        if (
            ly >=
                ROAD_TILES - 2 &&
            lx % 2 === 0
        ) {
            ctx.fillStyle =
                "#b4b4aa";

            ctx.fillRect(
                sx + 3,
                sy + 3,
                TILE - 6,
                7
            );
        }

        if (
            lx >=
                ROAD_TILES - 2 &&
            ly % 2 === 0
        ) {
            ctx.fillStyle =
                "#b4b4aa";

            ctx.fillRect(
                sx + 3,
                sy + 3,
                7,
                TILE - 6
            );
        }

        return;
    }

    /*
        Vertical road.
    */

    if (
        lx < ROAD_TILES
    ) {
        if (
            lx ===
                Math.floor(center)
        ) {
            ctx.fillStyle =
                "#b3a354";

            ctx.fillRect(
                sx + 3,
                sy,
                2,
                TILE
            );

            ctx.fillRect(
                sx + 8,
                sy,
                2,
                TILE
            );
        }

        /*
            White dashed lane separators.
        */

        if (
            (
                lx === 2 ||
                lx === 7
            ) &&
            gy % 3 !== 1
        ) {
            ctx.fillStyle =
                "#7a7a74";

            ctx.fillRect(
                sx + TILE / 2,
                sy + 4,
                2,
                TILE - 8
            );
        }
    }

    /*
        Horizontal road.
    */

    if (
        ly < ROAD_TILES
    ) {
        if (
            ly ===
                Math.floor(center)
        ) {
            ctx.fillStyle =
                "#b3a354";

            ctx.fillRect(
                sx,
                sy + 3,
                TILE,
                2
            );

            ctx.fillRect(
                sx,
                sy + 8,
                TILE,
                2
            );
        }

        if (
            (
                ly === 2 ||
                ly === 7
            ) &&
            gx % 3 !== 1
        ) {
            ctx.fillStyle =
                "#7a7a74";

            ctx.fillRect(
                sx + 4,
                sy + TILE / 2,
                TILE - 8,
                2
            );
        }
    }
}

/* ============================================================
   WALL / WINDOW / DOOR TILES
============================================================ */

function drawOverlayTile(
    type,
    sx,
    sy
) {
    if (
        type === "wallBrick"
    ) {
        ctx.fillStyle =
            COLORS.wallBrick;

        ctx.fillRect(
            sx,
            sy,
            TILE,
            TILE
        );

        ctx.fillStyle =
            "#594a3f";

        ctx.fillRect(
            sx,
            sy,
            TILE,
            4
        );

        ctx.strokeStyle =
            "rgba(20,10,5,.25)";

        ctx.strokeRect(
            sx,
            sy,
            TILE,
            TILE
        );

        return;
    }

    if (
        type === "wallConcrete"
    ) {
        ctx.fillStyle =
            COLORS.wallConcrete;

        ctx.fillRect(
            sx,
            sy,
            TILE,
            TILE
        );

        ctx.fillStyle =
            "#5b5d5a";

        ctx.fillRect(
            sx,
            sy,
            TILE,
            4
        );

        return;
    }

    if (
        type === "wallLight"
    ) {
        ctx.fillStyle =
            COLORS.wallLight;

        ctx.fillRect(
            sx,
            sy,
            TILE,
            TILE
        );

        ctx.fillStyle =
            "#6c6961";

        ctx.fillRect(
            sx,
            sy,
            TILE,
            4
        );

        return;
    }

    if (
        type === "windowH"
    ) {
        ctx.fillStyle =
            COLORS.wallBrick;

        ctx.fillRect(
            sx,
            sy,
            TILE,
            TILE
        );

        ctx.fillStyle =
            COLORS.window;

        ctx.fillRect(
            sx + 3,
            sy + 9,
            TILE - 6,
            6
        );

        ctx.fillStyle =
            "#252b2c";

        ctx.fillRect(
            sx + TILE / 2 - 1,
            sy + 9,
            2,
            6
        );

        return;
    }

    if (
        type === "windowV"
    ) {
        ctx.fillStyle =
            COLORS.wallBrick;

        ctx.fillRect(
            sx,
            sy,
            TILE,
            TILE
        );

        ctx.fillStyle =
            COLORS.window;

        ctx.fillRect(
            sx + 9,
            sy + 3,
            6,
            TILE - 6
        );

        return;
    }

    if (
        type === "door"
    ) {
        ctx.fillStyle =
            "#302821";

        ctx.fillRect(
            sx + 4,
            sy + 4,
            TILE - 8,
            TILE - 8
        );

        ctx.fillStyle =
            COLORS.door;

        ctx.fillRect(
            sx + 7,
            sy + 7,
            TILE - 14,
            TILE - 14
        );

        return;
    }

    if (
        type === "fence"
    ) {
        ctx.strokeStyle =
            COLORS.fence;

        ctx.lineWidth = 3;

        ctx.strokeRect(
            sx + 4,
            sy + 4,
            TILE - 8,
            TILE - 8
        );

        ctx.beginPath();

        ctx.moveTo(
            sx + 4,
            sy + 4
        );

        ctx.lineTo(
            sx + TILE - 4,
            sy + TILE - 4
        );

        ctx.moveTo(
            sx + TILE - 4,
            sy + 4
        );

        ctx.lineTo(
            sx + 4,
            sy + TILE - 4
        );

        ctx.stroke();
    }
}

/* ============================================================
   PROPS
============================================================ */

function drawProp(
    prop,
    originX,
    originY
) {
    const worldX =
        originX +
        prop.x * TILE;

    const worldY =
        originY +
        prop.y * TILE;

    const sx =
        screenX(worldX);

    const sy =
        screenY(worldY);

    if (
        sx < -TILE ||
        sy < -TILE ||
        sx > screenWidth + TILE ||
        sy > screenHeight + TILE
    )
        return;

    switch (prop.kind) {
        case "bed":
        case "medicalBed":
            ctx.fillStyle =
                prop.kind === "medicalBed"
                    ? "#c2c7be"
                    : COLORS.bed;

            ctx.fillRect(
                sx + 3,
                sy + 3,
                TILE - 6,
                TILE - 6
            );

            ctx.fillStyle =
                "#dedbd0";

            ctx.fillRect(
                sx + 5,
                sy + 4,
                TILE - 10,
                6
            );
            break;

        case "sofa":
            ctx.fillStyle =
                COLORS.sofa;

            ctx.fillRect(
                sx + 2,
                sy + 6,
                TILE - 4,
                TILE - 9
            );

            ctx.fillStyle =
                "#72665a";

            ctx.fillRect(
                sx + 4,
                sy + 8,
                TILE - 8,
                5
            );
            break;

        case "table":
            ctx.fillStyle =
                COLORS.table;

            ctx.fillRect(
                sx + 4,
                sy + 4,
                TILE - 8,
                TILE - 8
            );
            break;

        case "chair":
            ctx.fillStyle =
                "#514335";

            ctx.fillRect(
                sx + 8,
                sy + 8,
                8,
                8
            );
            break;

        case "desk":
            ctx.fillStyle =
                COLORS.desk;

            ctx.fillRect(
                sx + 3,
                sy + 6,
                TILE - 6,
                12
            );

            ctx.fillStyle =
                "#24282a";

            ctx.fillRect(
                sx + 8,
                sy + 8,
                8,
                5
            );
            break;

        case "shelf":
        case "medicalShelf":
        case "warehouseRack":
            ctx.fillStyle =
                prop.kind === "medicalShelf"
                    ? "#7b8178"
                    : COLORS.shelf;

            ctx.fillRect(
                sx + 4,
                sy + 3,
                TILE - 8,
                TILE - 6
            );

            ctx.fillStyle =
                "#2c2925";

            ctx.fillRect(
                sx + 6,
                sy + 8,
                TILE - 12,
                2
            );

            ctx.fillRect(
                sx + 6,
                sy + 14,
                TILE - 12,
                2
            );
            break;

        case "counter":
            ctx.fillStyle =
                COLORS.counter;

            ctx.fillRect(
                sx + 2,
                sy + 5,
                TILE - 4,
                TILE - 10
            );
            break;

        case "dresser":
            ctx.fillStyle =
                "#544437";

            ctx.fillRect(
                sx + 4,
                sy + 4,
                TILE - 8,
                TILE - 8
            );

            ctx.fillStyle =
                "#2c251f";

            ctx.fillRect(
                sx + 7,
                sy + 10,
                TILE - 14,
                2
            );
            break;

        case "dumpster":
            ctx.fillStyle =
                "#314c3c";

            ctx.fillRect(
                sx + 2,
                sy + 5,
                TILE - 4,
                TILE - 7
            );

            ctx.fillStyle =
                "#1e3027";

            ctx.fillRect(
                sx + 4,
                sy + 3,
                TILE - 8,
                5
            );
            break;

        case "crate":
            ctx.fillStyle =
                "#745539";

            ctx.fillRect(
                sx + 3,
                sy + 3,
                TILE - 6,
                TILE - 6
            );

            ctx.strokeStyle =
                "#3c2b1e";

            ctx.strokeRect(
                sx + 4,
                sy + 4,
                TILE - 8,
                TILE - 8
            );
            break;

        case "hydrant":
            ctx.fillStyle =
                "#a34b3a";

            ctx.fillRect(
                sx + 8,
                sy + 7,
                8,
                13
            );

            ctx.fillRect(
                sx + 5,
                sy + 11,
                14,
                5
            );
            break;

        case "trash":
            ctx.fillStyle =
                "#303234";

            ctx.fillRect(
                sx + 6,
                sy + 5,
                12,
                15
            );
            break;

        case "bench":
            ctx.fillStyle =
                "#72543b";

            ctx.fillRect(
                sx + 2,
                sy + 8,
                TILE - 4,
                7
            );

            ctx.fillRect(
                sx + 4,
                sy + 15,
                3,
                5
            );

            ctx.fillRect(
                sx + TILE - 7,
                sy + 15,
                3,
                5
            );
            break;

        case "tree":
            drawTree(
                sx,
                sy
            );
            break;

        case "car":
            drawCar(
                sx,
                sy,
                prop
            );
            break;

        case "awning":
            ctx.fillStyle =
                "#8c5144";

            ctx.fillRect(
                sx + 2,
                sy + 2,
                TILE - 4,
                6
            );

            ctx.fillStyle =
                "#d0c3a1";

            ctx.fillRect(
                sx + 5,
                sy + 2,
                3,
                6
            );

            ctx.fillRect(
                sx + 13,
                sy + 2,
                3,
                6
            );
            break;
    }
}

function drawTree(sx, sy) {
    ctx.fillStyle =
        "#3c2e21";

    ctx.fillRect(
        sx + 10,
        sy + 10,
        5,
        12
    );

    ctx.fillStyle =
        "#213820";

    ctx.beginPath();

    ctx.arc(
        sx + 13,
        sy + 10,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "#365635";

    ctx.beginPath();

    ctx.arc(
        sx + 9,
        sy + 6,
        8,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

function drawCar(
    sx,
    sy,
    prop
) {
    const palette = [
        "#414b52",
        "#683d38",
        "#3d4542",
        "#56564e",
        "#334553"
    ];

    const color =
        palette[
            hash(
                prop.x,
                prop.y,
                7000
            ) %
            palette.length
        ];

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fillRect(
        sx + 5,
        sy + 5,
        TILE - 4,
        TILE - 2
    );

    ctx.fillStyle =
        color;

    ctx.fillRect(
        sx + 3,
        sy + 2,
        TILE - 6,
        TILE - 4
    );

    ctx.fillStyle =
        "#1d272b";

    ctx.fillRect(
        sx + 7,
        sy + 5,
        TILE - 14,
        6
    );

    ctx.fillRect(
        sx + 7,
        sy + 14,
        TILE - 14,
        5
    );

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        sx + 1,
        sy + 5,
        4,
        6
    );

    ctx.fillRect(
        sx + TILE - 5,
        sy + 5,
        4,
        6
    );
}

/* ============================================================
   PLAYER
============================================================ */

function drawPlayer() {
    const x =
        Math.floor(
            screenWidth / 2
        );

    const y =
        Math.floor(
            screenHeight / 2
        );

    const bob =
        player.moving
            ? Math.round(
                Math.sin(
                    performance.now() *
                    .018
                ) * 1
            )
            : 0;

    /*
        Shadow.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.42)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 10,
        8,
        4,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
        Legs.
    */

    ctx.fillStyle =
        "#292c30";

    ctx.fillRect(
        x - 6,
        y + 2 + bob,
        4,
        10
    );

    ctx.fillRect(
        x + 2,
        y + 2 - bob,
        4,
        10
    );

    /*
        Torso.
    */

    ctx.fillStyle =
        "#48545a";

    ctx.fillRect(
        x - 7,
        y - 9,
        14,
        13
    );

    /*
        Arms.
    */

    ctx.fillStyle =
        "#9b7155";

    ctx.fillRect(
        x - 10,
        y - 7,
        3,
        10
    );

    ctx.fillRect(
        x + 7,
        y - 7,
        3,
        10
    );

    /*
        Head.
    */

    ctx.fillStyle =
        "#a77b5a";

    ctx.fillRect(
        x - 5,
        y - 17,
        10,
        9
    );

    /*
        Hair.
    */

    ctx.fillStyle =
        "#201b18";

    ctx.fillRect(
        x - 5,
        y - 19,
        10,
        4
    );

    /*
        Facing indicator kept subtle.
    */

    ctx.fillStyle =
        "#cbc8ad";

    let fx = x;
    let fy = y;

    if (player.facing === "up")
        fy -= 23;

    if (player.facing === "down")
        fy += 18;

    if (player.facing === "left")
        fx -= 14;

    if (player.facing === "right")
        fx += 14;

    ctx.fillRect(
        fx - 1,
        fy - 1,
        3,
        3
    );
}

/* ============================================================
   GAME LOOP
============================================================ */

let previousTime =
    performance.now();

function gameLoop(time) {
    const dt =
        Math.min(
            .05,
            (
                time -
                previousTime
            ) /
            1000
        );

    previousTime = time;

    updatePlayer(dt);
    updateCamera(dt);
    drawWorld();

    requestAnimationFrame(
        gameLoop
    );
}

requestAnimationFrame(
    gameLoop
);

</script>
