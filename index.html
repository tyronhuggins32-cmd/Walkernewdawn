<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Walker: New Dawn</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0c;color:#eee;font-family:Arial,sans-serif;touch-action:none}
button,input{font:inherit}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;left:14px;top:12px;z-index:5;display:none;text-shadow:2px 2px #000;pointer-events:none}
#hud b{font-size:17px;letter-spacing:1px}
#area,#seedView{margin-top:4px;font-size:10px;color:#aaa99d}
#staminaBox{width:150px;height:9px;margin-top:8px;border:2px solid #090a0b;background:#25282a}
#stamina{height:100%;width:100%;background:#aaa66e}
#menuBtn{display:none;position:fixed;right:14px;top:14px;z-index:8;padding:9px 12px;border:1px solid #55584f;background:#151918dd;color:#ddd9c7;font-size:10px;font-weight:900;letter-spacing:1.4px}
body.playing #hud,body.playing #menuBtn{display:block}
#menu{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 35%,#303831 0,#0c0f10 48%,#050607 100%)}
#menu.hidden{display:none}
.panel{width:min(470px,100%);padding:32px;border:1px solid #55584d;border-top:3px solid #aaa66e;background:#141819f5;box-shadow:0 25px 80px #000;color:#ecebdd}
.kicker{margin:0 0 8px;color:#aaa66e;font-size:10px;font-weight:900;letter-spacing:3px}
.panel h1{margin:0;font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(44px,12vw,66px);font-weight:400;line-height:.88;text-transform:uppercase;text-shadow:4px 5px #080a0b}
.sub{margin:16px 0 25px;color:#a9aaa2;font-size:12px;line-height:1.5}
.panel label{display:block;margin-bottom:7px;font-size:10px;font-weight:900;letter-spacing:1.5px}
.seedRow{display:grid;grid-template-columns:1fr 48px;gap:8px}
.seedRow input{min-width:0;padding:13px;border:1px solid #4d5049;outline:0;background:#080a0b;color:#f2efdf;font:16px "Courier New",monospace}
.seedRow input:focus{border-color:#b2ad73}
.seedRow button{border:1px solid #4d5049;background:#252a27;color:#ddd8c4;font-size:21px}
.actions{display:grid;gap:8px;margin-top:13px}
.actions button{min-height:48px;font-size:11px;font-weight:900;letter-spacing:2px}
.start{border:1px solid #cbc58b;background:#a9a36b;color:#101211}
.continue{border:1px solid #50534d;background:transparent;color:#ddd}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px}
.types span{padding:8px 3px;border:1px solid #ffffff18;color:#999b93;font-size:8px;font-weight:900;text-align:center;text-transform:uppercase}
.note{margin:14px 0 0;color:#747870;font-size:9px;line-height:1.5;text-align:center}
#joy{display:none;position:fixed;left:20px;bottom:22px;z-index:7;width:122px;height:122px;border:2px solid #ffffff2c;border-radius:50%;background:#ffffff0d}
#stick{position:absolute;left:39px;top:39px;width:42px;height:42px;border-radius:50%;background:#ffffff40}
#run{display:none;position:fixed;right:25px;bottom:34px;z-index:7;width:82px;height:82px;border:2px solid #ffffff2e;border-radius:50%;background:#ffffff12;color:#fff;font-size:11px;font-weight:900;align-items:center;justify-content:center;user-select:none}
@media(pointer:coarse){
body.playing #joy{display:block}
body.playing #run{display:flex}
}
@media(max-width:520px){
.panel{padding:27px 21px}
.types{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <b>WALKER: NEW DAWN</b>
  <div id="area">NEW DAWN CITY</div>
  <div id="seedView">SEED • —</div>
  <div id="staminaBox"><div id="stamina"></div></div>
</div>

<button id="menuBtn" type="button">MENU</button>

<div id="joy"><div id="stick"></div></div>
<div id="run">SPRINT</div>

<div id="menu" role="dialog" aria-modal="true">
  <main class="panel">
    <p class="kicker">CITY SURVIVAL PROTOTYPE</p>
    <h1>Walker:<br>New Dawn</h1>
    <p class="sub">Enter any seed to build a repeatable, human-scale city with connected streets and enterable interiors.</p>
    <label for="seed">WORLD SEED</label>
    <div class="seedRow">
      <input id="seed" maxlength="40" autocomplete="off" spellcheck="false">
      <button id="random" type="button">↻</button>
    </div>
    <div class="actions">
      <button class="start" id="start" type="button">GENERATE CITY</button>
      <button class="continue" id="continue" type="button" hidden>RETURN TO CITY</button>
    </div>
    <div class="types">
      <span>Houses</span>
      <span>Apartments</span>
      <span>Delis</span>
      <span>Police</span>
    </div>
    <p class="note">One tile equals one meter. The same seed always rebuilds the same city.</p>
  </main>
</div>

<script>
"use strict";

/* CANVAS AND WORLD SCALE */

const canvas=document.querySelector("#game");
const ctx=canvas.getContext("2d");

let SW=innerWidth;
let SH=innerHeight;

function resize(){
  SW=innerWidth;
  SH=innerHeight;

  const d=Math.min(devicePixelRatio||1,2);

  canvas.width=Math.floor(SW*d);
  canvas.height=Math.floor(SH*d);
  canvas.style.width=SW+"px";
  canvas.style.height=SH+"px";

  ctx.setTransform(d,0,0,d,0,0);
  ctx.imageSmoothingEnabled=false;
}

addEventListener("resize",resize);
resize();

const PX=22;
const BLOCK=64;
const ROAD=8;
const WALK=1.8*PX;
const SPRINT=4*PX;
const BUILD_MIN=10;
const BUILD_MAX=62;
const CHUNK_PX=BLOCK*PX;

const COLORS={
  road:"#1b1e20",
  line:"#a79b54",
  sidewalk:"#60615c",
  lot:"#30332f",
  grass:"#29402a",
  parking:"#2b2d2e",
  house:"#716858",
  apartment:"#66635c",
  deli:"#675f50",
  police:"#60696c",
  brick:"#4d4037",
  concrete:"#494b49",
  storeWall:"#57534b",
  policeWall:"#3d4b52",
  door:"#805a3d"
};

/* SEEDED RANDOMNESS */

let seedLabel="NEW-DAWN-1987";
let worldSeed=1;

function seedNumber(text){
  let h=2166136261;

  for(let i=0;i<text.length;i++){
    h^=text.charCodeAt(i);
    h=Math.imul(h,16777619);
  }

  h^=h>>>16;
  h=Math.imul(h,2246822507);

  return(h>>>0)||1;
}

function hash(x,y,salt=0){
  let h=
    worldSeed^
    Math.imul(x,374761393)^
    Math.imul(y,668265263)^
    Math.imul(salt,1442695041);

  h=Math.imul(h^(h>>>16),2246822507);
  h=Math.imul(h^(h>>>13),3266489909);

  return(h^(h>>>16))>>>0;
}

function rand(x,y,salt=0){
  return hash(x,y,salt)/4294967296;
}

function mod(number,divisor){
  return((number%divisor)+divisor)%divisor;
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function noise(x,y,salt){
  const x0=Math.floor(x);
  const y0=Math.floor(y);
  const tx=x-x0;
  const ty=y-y0;
  const u=tx*tx*(3-2*tx);
  const v=ty*ty*(3-2*ty);

  return lerp(
    lerp(rand(x0,y0,salt),rand(x0+1,y0,salt),u),
    lerp(rand(x0,y0+1,salt),rand(x0+1,y0+1,salt),u),
    v
  );
}

function density(cx,cy){
  return noise(cx/7,cy/7,20)*.72+
         noise(cx/3,cy/3,21)*.28;
}

function isPolice(cx,cy){
  const sectorX=Math.floor(cx/6);
  const sectorY=Math.floor(cy/6);

  return(
    cx===sectorX*6+hash(sectorX,sectorY,30)%6&&
    cy===sectorY*6+hash(sectorX,sectorY,31)%6
  );
}

function isCommercial(cx,cy){
  const vertical=
    mod(cx+(hash(0,Math.floor(cy/10),40)%3),6)===0;

  const horizontal=
    mod(cy+(hash(Math.floor(cx/10),0,41)%3),7)===0;

  return vertical||horizontal;
}

/* WORLD DATA */

const chunks=new Map();
const key=(x,y)=>x+","+y;

function wall(chunk,x,y,type){
  chunk.walls.set(key(x,y),type);
  chunk.solid.add(key(x,y));
}

function clearWall(chunk,x,y){
  chunk.walls.delete(key(x,y));
  chunk.solid.delete(key(x,y));
}

function lineH(chunk,y,x1,x2,gap,type){
  for(let x=x1;x<=x2;x++){
    if(x!==gap)wall(chunk,x,y,type);
  }
}

function lineV(chunk,x,y1,y2,gap,type){
  for(let y=y1;y<=y2;y++){
    if(y!==gap)wall(chunk,x,y,type);
  }
}

function addProp(chunk,kind,x,y,w=1,h=1,solid=false){
  const prop={kind,x,y,w,h};

  chunk.props.push(prop);

  if(solid){
    for(let py=y;py<y+h;py++){
      for(let px=x;px<x+w;px++){
        chunk.solid.add(key(px,py));
      }
    }
  }

  return prop;
}

function rect(x,y,w,h){
  return{x,y,w,h};
}

/* BUILDINGS */

function addBuilding(chunk,r,type,id){
  const wallType=
    type==="house"?"brick":
    type==="apartment"?"concrete":
    type==="deli"?"storeWall":
    "policeWall";

  const building={
    ...r,
    type,
    id,
    floor:COLORS[type],
    wallType,
    doors:[]
  };

  chunk.buildings.push(building);

  for(let x=r.x;x<r.x+r.w;x++){
    wall(chunk,x,r.y,wallType);
    wall(chunk,x,r.y+r.h-1,wallType);
  }

  for(let y=r.y;y<r.y+r.h;y++){
    wall(chunk,r.x,y,wallType);
    wall(chunk,r.x+r.w-1,y,wallType);
  }

  const centerX=r.x+r.w/2;
  const centerY=r.y+r.h/2;

  const distances={
    top:centerY-BUILD_MIN,
    left:centerX-BUILD_MIN,
    right:BUILD_MAX-centerX,
    bottom:BUILD_MAX-centerY
  };

  const side=Object.keys(distances)
    .sort((a,b)=>distances[a]-distances[b])[0];

  let doorX;
  let doorY;

  if(side==="top"||side==="bottom"){
    doorX=r.x+Math.floor(r.w/2);
    doorY=side==="top"?r.y:r.y+r.h-1;
  }else{
    doorX=side==="left"?r.x:r.x+r.w-1;
    doorY=r.y+Math.floor(r.h/2);
  }

  clearWall(chunk,doorX,doorY);

  building.doors.push({
    x:doorX,
    y:doorY,
    side
  });

  if(type==="house")homeInterior(chunk,r,wallType);
  if(type==="apartment")apartmentInterior(chunk,r,wallType);
  if(type==="deli")deliInterior(chunk,r,wallType);
  if(type==="police")policeInterior(chunk,r,wallType);

  return building;
}

/* INTERIORS */

function homeInterior(chunk,r,wallType){
  const middleX=r.x+Math.floor(r.w*.55);
  const middleY=r.y+Math.floor(r.h*.52);

  if(r.w>=10){
    lineV(
      chunk,
      middleX,
      r.y+1,
      r.y+r.h-2,
      middleY-1,
      wallType
    );
  }

  lineH(
    chunk,
    middleY,
    r.x+1,
    Math.max(r.x+1,middleX-1),
    r.x+2,
    wallType
  );

  addProp(chunk,"bed",r.x+r.w-3,r.y+2,1,2,true);
  addProp(chunk,"dresser",r.x+r.w-3,r.y+5,1,1,true);
  addProp(chunk,"sofa",r.x+2,r.y+r.h-3,2,1,true);
  addProp(chunk,"rug",r.x+2,r.y+r.h-6,3,2,false);
  addProp(chunk,"table",r.x+2,r.y+2,2,1,true);
  addProp(chunk,"kitchen",r.x+2,middleY+1,2,1,true);
}

function apartmentInterior(chunk,r,wallType){
  if(r.w<12){
    homeInterior(chunk,r,wallType);
    return;
  }

  if(r.w>=30){
    const hallLeft=r.x+Math.floor(r.w/2)-2;
    const hallRight=hallLeft+4;
    const unitHeight=Math.floor((r.h-2)/3);
    const doorRows=[];

    for(let row=0;row<3;row++){
      doorRows.push(r.y+3+row*unitHeight);
    }

    for(let y=r.y+1;y<r.y+r.h-1;y++){
      if(!doorRows.includes(y)){
        wall(chunk,hallLeft,y,wallType);
        wall(chunk,hallRight,y,wallType);
      }
    }

    for(let row=1;row<3;row++){
      const split=r.y+1+row*unitHeight;

      lineH(
        chunk,
        split,
        r.x+1,
        hallLeft-1,
        r.x+3,
        wallType
      );

      lineH(
        chunk,
        split,
        hallRight+1,
        r.x+r.w-2,
        r.x+r.w-4,
        wallType
      );
    }

    for(let row=0;row<3;row++){
      const unitY=r.y+2+row*unitHeight;

      addProp(chunk,"bed",r.x+2,unitY,1,2,true);
      addProp(chunk,"sofa",r.x+6,unitY+2,2,1,true);
      addProp(chunk,"bed",r.x+r.w-3,unitY,1,2,true);
      addProp(chunk,"sofa",r.x+r.w-8,unitY+2,2,1,true);
    }

    addProp(chunk,"mail",hallLeft+2,r.y+2,1,2,false);
    addProp(chunk,"rug",hallLeft+1,r.y+6,3,4,false);

    return;
  }

  const middleX=r.x+Math.floor(r.w/2);
  const middleY=r.y+Math.floor(r.h/2);

  lineV(
    chunk,
    middleX-1,
    r.y+1,
    r.y+r.h-2,
    r.y+Math.floor(r.h*.3),
    wallType
  );

  lineV(
    chunk,
    middleX+1,
    r.y+1,
    r.y+r.h-2,
    r.y+Math.floor(r.h*.7),
    wallType
  );

  lineH(
    chunk,
    middleY,
    r.x+1,
    middleX-2,
    r.x+2,
    wallType
  );

  lineH(
    chunk,
    middleY,
    middleX+2,
    r.x+r.w-2,
    r.x+r.w-3,
    wallType
  );

  const beds=[
    [r.x+2,r.y+2],
    [r.x+r.w-3,r.y+2],
    [r.x+2,r.y+r.h-4],
    [r.x+r.w-3,r.y+r.h-4]
  ];

  for(const [x,y] of beds){
    addProp(chunk,"bed",x,y,1,2,true);
  }

  addProp(chunk,"mail",middleX,r.y+2,1,1,false);
  addProp(chunk,"rug",middleX-1,r.y+5,3,4,false);
}

function deliInterior(chunk,r,wallType){
  const backRoomY=
    r.y+Math.max(6,Math.floor(r.h*.3));

  lineH(
    chunk,
    backRoomY,
    r.x+1,
    r.x+r.w-2,
    r.x+r.w-4,
    wallType
  );

  for(let y=backRoomY+3;y<r.y+r.h-3;y+=4){
    for(let x=r.x+3;x<r.x+r.w-3;x+=4){
      addProp(chunk,"shelf",x,y,1,3,true);
    }
  }

  addProp(chunk,"counter",r.x+2,r.y+r.h-3,4,1,true);
  addProp(chunk,"cooler",r.x+r.w-3,r.y+r.h-5,1,3,true);
  addProp(chunk,"freezer",r.x+2,r.y+2,3,2,true);
  addProp(chunk,"mat",r.x+Math.floor(r.w/2)-1,r.y+r.h-4,3,2,false);
}

function policeInterior(chunk,r,wallType){
  const splitY=r.y+9;
  const splitX=r.x+Math.floor(r.w*.58);

  lineH(
    chunk,
    splitY,
    r.x+1,
    r.x+r.w-2,
    splitX,
    wallType
  );

  lineV(
    chunk,
    splitX,
    splitY+1,
    r.y+r.h-2,
    splitY+3,
    wallType
  );

  const cellY=splitY+9;

  lineH(
    chunk,
    cellY,
    splitX+1,
    r.x+r.w-2,
    splitX+2,
    wallType
  );

  addProp(chunk,"desk",r.x+3,r.y+3,3,1,true);
  addProp(chunk,"desk",r.x+9,r.y+3,3,1,true);
  addProp(chunk,"bench",r.x+r.w-8,r.y+4,4,1,true);
  addProp(chunk,"desk",r.x+3,splitY+4,3,1,true);
  addProp(chunk,"desk",r.x+9,splitY+4,3,1,true);
  addProp(chunk,"evidence",r.x+3,r.y+r.h-4,4,1,true);
  addProp(chunk,"locker",splitX-3,r.y+r.h-4,2,1,true);
  addProp(chunk,"bars",r.x+r.w-3,splitY+3,1,5,true);
  addProp(chunk,"bars",r.x+r.w-3,cellY+2,1,5,true);
  addProp(chunk,"rug",r.x+16,r.y+3,5,3,false);
}

/* BUILDING BLOCK LAYOUTS */

function houseBlock(chunk){
  const columns=3;
  const rows=2;
  const width=BUILD_MAX-BUILD_MIN;
  const lotWidth=Math.floor(width/columns);
  const lotHeight=Math.floor(width/rows);

  let id=0;

  for(let gx=0;gx<columns;gx++){
    for(let gy=0;gy<rows;gy++){
      const lot=rect(
        BUILD_MIN+gx*lotWidth,
        BUILD_MIN+gy*lotHeight,
        gx===columns-1?width-lotWidth*gx:lotWidth,
        gy===rows-1?width-lotHeight*gy:lotHeight
      );

      chunk.lots.push({
        ...lot,
        ground:"grass"
      });

      const buildingWidth=lot.w-4;
      const buildingHeight=18;
      const buildingX=lot.x+2;

      const buildingY=
        gy===0
          ?lot.y+2
          :lot.y+lot.h-buildingHeight-2;

      addBuilding(
        chunk,
        rect(
          buildingX,
          buildingY,
          buildingWidth,
          buildingHeight
        ),
        "house",
        ++id
      );

      if(rand(chunk.cx,chunk.cy,100+id)>.52){
        addProp(
          chunk,
          "tree",
          lot.x+lot.w-3,
          gy===0?lot.y+lot.h-3:lot.y+2,
          1,
          1,
          true
        );
      }
    }
  }
}

function apartmentBlock(chunk){
  const width=BUILD_MAX-BUILD_MIN;

  chunk.lots.push({
    x:BUILD_MIN,
    y:BUILD_MIN,
    w:width,
    h:width,
    ground:"lot"
  });

  addBuilding(
    chunk,
    rect(
      BUILD_MIN+4,
      BUILD_MIN+3,
      44,
      38
    ),
    "apartment",
    1
  );

  addProp(
    chunk,
    "dumpster",
    BUILD_MAX-4,
    BUILD_MAX-4,
    2,
    2,
    true
  );

  for(let x=BUILD_MIN+7;x<BUILD_MAX-5;x+=7){
    if(rand(chunk.cx,chunk.cy,180+x)>.48){
      addProp(
        chunk,
        "car",
        x,
        BUILD_MAX-7,
        2,
        4,
        true
      );
    }
  }
}

function mixedBlock(chunk){
  const columns=2;
  const rows=2;
  const width=BUILD_MAX-BUILD_MIN;
  const lotWidth=Math.floor(width/columns);
  const lotHeight=Math.floor(width/rows);

  const deliIndex=hash(chunk.cx,chunk.cy,200)%4;

  const secondDeli=
    rand(chunk.cx,chunk.cy,201)>.72
      ?(deliIndex+2)%4
      :-1;

  let id=0;

  for(let gx=0;gx<columns;gx++){
    for(let gy=0;gy<rows;gy++){
      const index=id++;

      const lot=rect(
        BUILD_MIN+gx*lotWidth,
        BUILD_MIN+gy*lotHeight,
        gx===1?width-lotWidth:lotWidth,
        gy===1?width-lotHeight:lotHeight
      );

      const type=
        index===deliIndex||index===secondDeli
          ?"deli"
          :rand(chunk.cx,chunk.cy,220+index)>.28
            ?"apartment"
            :"house";

      chunk.lots.push({
        ...lot,
        ground:type==="house"?"grass":"lot"
      });

      let building;

      if(type==="deli"){
        building=rect(
          lot.x+4,
          lot.y+3,
          lot.w-8,
          lot.h-6
        );
      }else if(type==="house"){
        const buildingHeight=18;

        building=rect(
          lot.x+3,
          gy===0
            ?lot.y+2
            :lot.y+lot.h-buildingHeight-2,
          lot.w-6,
          buildingHeight
        );
      }else{
        building=rect(
          lot.x+2,
          lot.y+2,
          lot.w-4,
          lot.h-4
        );
      }

      addBuilding(chunk,building,type,id);
    }
  }
}

function policeBlock(chunk){
  const width=BUILD_MAX-BUILD_MIN;

  chunk.lots.push({
    x:BUILD_MIN,
    y:BUILD_MIN,
    w:width,
    h:width,
    ground:"parking"
  });

  addBuilding(
    chunk,
    rect(
      BUILD_MIN+4,
      BUILD_MIN+3,
      44,
      30
    ),
    "police",
    1
  );

  const parkingY=BUILD_MIN+38;

  for(let x=BUILD_MIN+6;x<BUILD_MAX-4;x+=6){
    if(rand(chunk.cx,chunk.cy,300+x)>.22){
      addProp(
        chunk,
        "policeCar",
        x,
        parkingY,
        2,
        4,
        true
      );
    }
  }
}

function generateChunk(cx,cy){
  const chunk={
    cx,
    cy,
    walls:new Map(),
    solid:new Set(),
    buildings:[],
    lots:[],
    props:[],
    district:"residential"
  };

  if(isPolice(cx,cy)){
    chunk.district="police precinct";
    policeBlock(chunk);
  }else if(isCommercial(cx,cy)){
    chunk.district="mixed use";
    mixedBlock(chunk);
  }else if(density(cx,cy)>.56){
    chunk.district="apartment district";
    apartmentBlock(chunk);
  }else{
    houseBlock(chunk);
  }

  return chunk;
}

function getChunk(cx,cy){
  const chunkKey=key(cx,cy);

  if(!chunks.has(chunkKey)){
    chunks.set(chunkKey,generateChunk(cx,cy));
  }

  return chunks.get(chunkKey);
}

/* PLAYER AND COLLISION */

const player={
  x:ROAD*.5*PX,
  y:ROAD*.5*PX,
  w:.65*PX,
  h:.85*PX,
  stamina:100,
  facing:"down",
  moving:false
};

const camera={
  x:player.x,
  y:player.y
};

function solidTile(tileX,tileY){
  const chunkX=Math.floor(tileX/BLOCK);
  const chunkY=Math.floor(tileY/BLOCK);
  const localX=mod(tileX,BLOCK);
  const localY=mod(tileY,BLOCK);

  return getChunk(chunkX,chunkY)
    .solid
    .has(key(localX,localY));
}

function collides(x,y){
  const left=Math.floor((x-player.w/2)/PX);
  const right=Math.floor((x+player.w/2-.01)/PX);
  const top=Math.floor((y-player.h/2)/PX);
  const bottom=Math.floor((y+player.h/2-.01)/PX);

  for(let tileY=top;tileY<=bottom;tileY++){
    for(let tileX=left;tileX<=right;tileX++){
      if(solidTile(tileX,tileY))return true;
    }
  }

  return false;
}

const keys={};

let touchX=0;
let touchY=0;
let touchRun=false;
let started=false;
let playing=false;

addEventListener("keydown",event=>{
  if(event.key==="Escape"&&started){
    openMenu();
    return;
  }

  if(playing){
    keys[event.key.toLowerCase()]=true;
  }
});

addEventListener("keyup",event=>{
  keys[event.key.toLowerCase()]=false;
});

addEventListener("blur",()=>{
  for(const keyName in keys){
    keys[keyName]=false;
  }

  touchX=0;
  touchY=0;
  touchRun=false;
});

function update(deltaTime){
  let movementX=
    (keys.d||keys.arrowright?1:0)-
    (keys.a||keys.arrowleft?1:0)+
    touchX;

  let movementY=
    (keys.s||keys.arrowdown?1:0)-
    (keys.w||keys.arrowup?1:0)+
    touchY;

  const magnitude=Math.hypot(movementX,movementY);

  if(magnitude>1){
    movementX/=magnitude;
    movementY/=magnitude;
  }

  const running=
    (keys.shift||touchRun)&&
    player.stamina>0&&
    magnitude>.05;

  const speed=running?SPRINT:WALK;

  player.moving=magnitude>.05;

  if(running){
    player.stamina=Math.max(
      0,
      player.stamina-24*deltaTime
    );
  }else{
    player.stamina=Math.min(
      100,
      player.stamina+12*deltaTime
    );
  }

  if(Math.abs(movementX)>.05){
    player.facing=movementX>0?"right":"left";
  }

  if(Math.abs(movementY)>Math.abs(movementX)){
    player.facing=movementY>0?"down":"up";
  }

  const nextX=player.x+movementX*speed*deltaTime;
  const nextY=player.y+movementY*speed*deltaTime;

  if(!collides(nextX,player.y)){
    player.x=nextX;
  }

  if(!collides(player.x,nextY)){
    player.y=nextY;
  }

  camera.x+=(player.x-camera.x)*Math.min(1,deltaTime*9);
  camera.y+=(player.y-camera.y)*Math.min(1,deltaTime*9);

  document.querySelector("#stamina").style.width=
    player.stamina+"%";

  const chunkX=Math.floor(player.x/CHUNK_PX);
  const chunkY=Math.floor(player.y/CHUNK_PX);

  document.querySelector("#area").textContent=
    "NEW DAWN CITY • "+
    getChunk(chunkX,chunkY).district.toUpperCase();

  pruneChunks(chunkX,chunkY);
}

function pruneChunks(centerX,centerY){
  if(chunks.size<90)return;

  for(const [chunkKey,chunk] of chunks){
    if(
      Math.abs(chunk.cx-centerX)>5||
      Math.abs(chunk.cy-centerY)>5
    ){
      chunks.delete(chunkKey);
    }
  }
}

/* DRAWING */

const screenX=x=>Math.round(x-camera.x+SW/2);
const screenY=y=>Math.round(y-camera.y+SH/2);

function fillWorld(x,y,w,h,color){
  ctx.fillStyle=color;

  ctx.fillRect(
    screenX(x),
    screenY(y),
    Math.ceil(w),
    Math.ceil(h)
  );
}

function drawBase(chunk){
  const originX=chunk.cx*CHUNK_PX;
  const originY=chunk.cy*CHUNK_PX;

  fillWorld(originX,originY,CHUNK_PX,CHUNK_PX,COLORS.lot);
  fillWorld(originX,originY,ROAD*PX,CHUNK_PX,COLORS.road);
  fillWorld(originX,originY,CHUNK_PX,ROAD*PX,COLORS.road);

  fillWorld(
    originX+ROAD*PX,
    originY+ROAD*PX,
    2*PX,
    (BLOCK-ROAD)*PX,
    COLORS.sidewalk
  );

  fillWorld(
    originX+ROAD*PX,
    originY+ROAD*PX,
    (BLOCK-ROAD)*PX,
    2*PX,
    COLORS.sidewalk
  );

  fillWorld(
    originX+(BLOCK-2)*PX,
    originY+ROAD*PX,
    2*PX,
    (BLOCK-ROAD)*PX,
    COLORS.sidewalk
  );

  fillWorld(
    originX+ROAD*PX,
    originY+(BLOCK-2)*PX,
    (BLOCK-ROAD)*PX,
    2*PX,
    COLORS.sidewalk
  );

  ctx.fillStyle=COLORS.line;

  for(let y=ROAD+2;y<BLOCK;y+=4){
    ctx.fillRect(
      screenX(originX+3.94*PX),
      screenY(originY+y*PX),
      2,
      2*PX
    );
  }

  for(let x=ROAD+2;x<BLOCK;x+=4){
    ctx.fillRect(
      screenX(originX+x*PX),
      screenY(originY+3.94*PX),
      2*PX,
      2
    );
  }

  ctx.fillStyle="#b7b6ad";

  for(let i=0;i<ROAD;i+=2){
    ctx.fillRect(
      screenX(originX+i*PX)+3,
      screenY(originY+(ROAD-1)*PX),
      PX-6,
      5
    );

    ctx.fillRect(
      screenX(originX+(ROAD-1)*PX),
      screenY(originY+i*PX)+3,
      5,
      PX-6
    );
  }
}

function drawStreetDetails(chunk){
  const originX=chunk.cx*CHUNK_PX;
  const originY=chunk.cy*CHUNK_PX;

  ctx.fillStyle="rgba(0,0,0,.28)";

  ctx.fillRect(
    screenX(originX+BUILD_MIN*PX)-3,
    screenY(originY+ROAD*PX),
    4,
    (BLOCK-ROAD)*PX
  );

  ctx.fillRect(
    screenX(originX+ROAD*PX),
    screenY(originY+BUILD_MIN*PX)-3,
    (BLOCK-ROAD)*PX,
    4
  );

  ctx.fillRect(
    screenX(originX+(BLOCK-2)*PX)-3,
    screenY(originY+ROAD*PX),
    4,
    (BLOCK-ROAD)*PX
  );

  ctx.fillRect(
    screenX(originX+ROAD*PX),
    screenY(originY+(BLOCK-2)*PX)-3,
    (BLOCK-ROAD)*PX,
    4
  );

  ctx.strokeStyle="rgba(30,32,30,.32)";
  ctx.lineWidth=1;

  for(let y=ROAD;y<BLOCK;y+=2){
    ctx.beginPath();
    ctx.moveTo(
      screenX(originX+ROAD*PX),
      screenY(originY+y*PX)
    );
    ctx.lineTo(
      screenX(originX+BUILD_MIN*PX),
      screenY(originY+y*PX)
    );
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(
      screenX(originX+(BLOCK-2)*PX),
      screenY(originY+y*PX)
    );
    ctx.lineTo(
      screenX(originX+BLOCK*PX),
      screenY(originY+y*PX)
    );
    ctx.stroke();
  }

  for(let x=ROAD;x<BLOCK;x+=2){
    ctx.beginPath();
    ctx.moveTo(
      screenX(originX+x*PX),
      screenY(originY+ROAD*PX)
    );
    ctx.lineTo(
      screenX(originX+x*PX),
      screenY(originY+BUILD_MIN*PX)
    );
    ctx.stroke();
  }

  ctx.fillStyle="rgba(125,128,120,.12)";

  for(let i=0;i<18;i++){
    const randomX=rand(chunk.cx,chunk.cy,900+i);
    const randomY=rand(chunk.cx,chunk.cy,940+i);

    if(randomX<.5){
      ctx.fillRect(
        screenX(originX+(1+randomX*12)*PX),
        screenY(originY+(ROAD+randomY*(BLOCK-ROAD))*PX),
        2+randomX*5,
        8+randomY*15
      );
    }else{
      ctx.fillRect(
        screenX(originX+(ROAD+randomX*(BLOCK-ROAD))*PX),
        screenY(originY+(1+randomY*12)*PX),
        8+randomX*15,
        2+randomY*5
      );
    }
  }
}

/* BUILDING DEPTH */

const WALL_DARK={
  brick:"#2f2722",
  concrete:"#303231",
  storeWall:"#36332e",
  policeWall:"#253137"
};

const WALL_LIGHT={
  brick:"#70594a",
  concrete:"#6a6d69",
  storeWall:"#777064",
  policeWall:"#5b727d"
};

const FLOOR_LIGHT={
  house:"#877a68",
  apartment:"#77736a",
  deli:"#7d745f",
  police:"#748083"
};

function buildingDepth(type){
  return type==="apartment"?18:
         type==="police"?15:
         type==="deli"?11:
         8;
}

function drawBuildingShadow(originX,originY,building){
  const x=screenX(originX+building.x*PX);
  const y=screenY(originY+building.y*PX);
  const width=building.w*PX;
  const height=building.h*PX;
  const depth=buildingDepth(building.type);

  ctx.fillStyle="rgba(0,0,0,.36)";
  ctx.fillRect(
    x+depth,
    y+depth,
    width,
    height
  );

  ctx.fillStyle=WALL_DARK[building.wallType];

  ctx.fillRect(
    x+Math.floor(depth*.45),
    y+Math.floor(depth*.45),
    width,
    height
  );
}

function drawFloor(originX,originY,building){
  const x=screenX(originX+(building.x+1)*PX);
  const y=screenY(originY+(building.y+1)*PX);
  const width=(building.w-2)*PX;
  const height=(building.h-2)*PX;

  const gradient=
    ctx.createLinearGradient(x,y,x+width,y+height);

  gradient.addColorStop(
    0,
    FLOOR_LIGHT[building.type]
  );

  gradient.addColorStop(
    1,
    building.floor
  );

  ctx.fillStyle=gradient;
  ctx.fillRect(x,y,width,height);

  ctx.save();
  ctx.beginPath();
  ctx.rect(x,y,width,height);
  ctx.clip();

  ctx.strokeStyle="rgba(20,22,21,.13)";
  ctx.lineWidth=1;

  if(building.type==="house"){
    for(let py=y+PX/2;py<y+height;py+=PX/2){
      ctx.beginPath();
      ctx.moveTo(x,py);
      ctx.lineTo(x+width,py);
      ctx.stroke();
    }

    for(let px=x+PX*2;px<x+width;px+=PX*2){
      ctx.beginPath();
      ctx.moveTo(px,y);
      ctx.lineTo(px,y+height);
      ctx.stroke();
    }
  }else{
    const step=
      building.type==="deli"?PX:PX*2;

    for(let px=x;px<x+width;px+=step){
      ctx.beginPath();
      ctx.moveTo(px,y);
      ctx.lineTo(px,y+height);
      ctx.stroke();
    }

    for(let py=y;py<y+height;py+=step){
      ctx.beginPath();
      ctx.moveTo(x,py);
      ctx.lineTo(x+width,py);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawWallBlock(originX,originY,x,y,type){
  const pixelX=screenX(originX+x*PX);
  const pixelY=screenY(originY+y*PX);

  ctx.fillStyle="rgba(0,0,0,.38)";
  ctx.fillRect(
    pixelX+5,
    pixelY+7,
    PX+1,
    PX+1
  );

  ctx.fillStyle=WALL_DARK[type];
  ctx.fillRect(
    pixelX+3,
    pixelY+4,
    PX+1,
    PX+1
  );

  ctx.fillStyle=COLORS[type];
  ctx.fillRect(
    pixelX,
    pixelY,
    PX+1,
    PX+1
  );

  ctx.fillStyle=WALL_LIGHT[type];
  ctx.fillRect(pixelX+2,pixelY+2,PX-3,3);
  ctx.fillRect(pixelX+2,pixelY+2,3,PX-3);

  ctx.fillStyle="rgba(0,0,0,.2)";
  ctx.fillRect(pixelX+3,pixelY+PX-4,PX-3,4);
  ctx.fillRect(pixelX+PX-4,pixelY+3,4,PX-3);
}

function doorAt(building,x,y){
  return building.doors.some(
    door=>door.x===x&&door.y===y
  );
}

function drawHorizontalWindow(x,y,width=PX-7){
  ctx.fillStyle="#142227";
  ctx.fillRect(x+2,y+2,width,9);

  ctx.fillStyle="#70949b";
  ctx.fillRect(x+3,y+3,width-2,5);

  ctx.fillStyle="#c2d5d3";
  ctx.fillRect(
    x+4,
    y+4,
    Math.max(2,(width-5)*.35),
    2
  );

  ctx.fillStyle="#202324";
  ctx.fillRect(x+2,y+11,width,3);
}

function drawVerticalWindow(x,y,height=PX-7){
  ctx.fillStyle="#142227";
  ctx.fillRect(x+2,y+2,9,height);

  ctx.fillStyle="#70949b";
  ctx.fillRect(x+3,y+3,5,height-2);

  ctx.fillStyle="#c2d5d3";
  ctx.fillRect(
    x+4,
    y+4,
    2,
    Math.max(2,(height-5)*.35)
  );

  ctx.fillStyle="#202324";
  ctx.fillRect(x+11,y+2,3,height);
}

function drawFacade(originX,originY,building){
  const buildingX=screenX(originX+building.x*PX);
  const buildingY=screenY(originY+building.y*PX);
  const buildingWidth=building.w*PX;
  const buildingHeight=building.h*PX;

  const spacing=
    building.type==="apartment"?3:
    building.type==="police"?4:
    5;

  ctx.strokeStyle=WALL_LIGHT[building.wallType];
  ctx.lineWidth=2;

  ctx.strokeRect(
    buildingX+2,
    buildingY+2,
    buildingWidth-4,
    buildingHeight-4
  );

  ctx.strokeStyle=WALL_DARK[building.wallType];

  ctx.strokeRect(
    buildingX+6,
    buildingY+6,
    buildingWidth-12,
    buildingHeight-12
  );

  for(
    let tileX=building.x+2;
    tileX<building.x+building.w-2;
    tileX+=spacing
  ){
    if(!doorAt(building,tileX,building.y)){
      drawHorizontalWindow(
        screenX(originX+tileX*PX),
        screenY(originY+building.y*PX)+5
      );
    }

    if(
      !doorAt(
        building,
        tileX,
        building.y+building.h-1
      )
    ){
      drawHorizontalWindow(
        screenX(originX+tileX*PX),
        screenY(
          originY+
          (building.y+building.h-1)*PX
        )+5
      );
    }
  }

  for(
    let tileY=building.y+2;
    tileY<building.y+building.h-2;
    tileY+=spacing
  ){
    if(!doorAt(building,building.x,tileY)){
      drawVerticalWindow(
        screenX(originX+building.x*PX)+5,
        screenY(originY+tileY*PX)
      );
    }

    if(
      !doorAt(
        building,
        building.x+building.w-1,
        tileY
      )
    ){
      drawVerticalWindow(
        screenX(
          originX+
          (building.x+building.w-1)*PX
        )+5,
        screenY(originY+tileY*PX)
      );
    }
  }

  if(building.type==="apartment"){
    ctx.fillStyle="#88877e";

    for(
      let tileX=building.x+1;
      tileX<building.x+building.w-1;
      tileX+=2
    ){
      ctx.fillRect(
        screenX(originX+tileX*PX),
        buildingY-4,
        PX,
        6
      );
    }
  }

  if(building.type==="police"){
    ctx.fillStyle="#293f55";

    ctx.fillRect(
      buildingX+PX*2,
      buildingY-7,
      buildingWidth-PX*4,
      9
    );

    ctx.fillStyle="#aabcc4";

    ctx.fillRect(
      buildingX+PX*2,
      buildingY-7,
      buildingWidth-PX*4,
      2
    );
  }
}

function drawAwning(x,y,side){
  ctx.save();
  ctx.fillStyle="#8b433a";

  if(side==="top"||side==="bottom"){
    const awningY=
      side==="top"?y-11:y+PX;

    ctx.fillRect(
      x-PX,
      awningY,
      PX*3,
      10
    );

    ctx.fillStyle="#d9caa7";

    for(let index=0;index<6;index+=2){
      ctx.fillRect(
        x-PX+index*PX/2,
        awningY,
        PX/2,
        10
      );
    }
  }else{
    const awningX=
      side==="left"?x-11:x+PX;

    ctx.fillRect(
      awningX,
      y-PX,
      10,
      PX*3
    );

    ctx.fillStyle="#d9caa7";

    for(let index=0;index<6;index+=2){
      ctx.fillRect(
        awningX,
        y-PX+index*PX/2,
        10,
        PX/2
      );
    }
  }

  ctx.restore();
}

function drawDoor(originX,originY,building,door){
  const x=screenX(originX+door.x*PX);
  const y=screenY(originY+door.y*PX);

  ctx.fillStyle="#2a2019";
  ctx.fillRect(x+2,y+2,PX-4,PX-4);

  ctx.fillStyle=COLORS.door;
  ctx.fillRect(x+4,y+3,PX-8,PX-7);

  ctx.fillStyle="#ad8a60";
  ctx.fillRect(x+PX-8,y+PX/2,3,3);

  ctx.fillStyle="#8a8b83";

  if(door.side==="top"){
    ctx.fillRect(x-3,y-8,PX+6,7);
  }

  if(door.side==="bottom"){
    ctx.fillRect(x-3,y+PX,PX+6,7);
  }

  if(door.side==="left"){
    ctx.fillRect(x-8,y-3,7,PX+6);
  }

  if(door.side==="right"){
    ctx.fillRect(x+PX,y-3,7,PX+6);
  }

  if(building.type==="deli"){
    drawAwning(x,y,door.side);
  }

  if(building.type!=="house"){
    const label=
      building.type==="police"?"NDPD":
      building.type==="deli"?"DELI":
      "APTS";

    ctx.fillStyle=
      building.type==="police"
        ?"#213b53"
        :"#3a3027";

    ctx.fillRect(
      x-PX*.55,
      y-13,
      PX*2.1,
      11
    );

    ctx.fillStyle="#f1ead2";
    ctx.font="bold 8px Courier New";
    ctx.textAlign="center";

    ctx.fillText(
      label,
      x+PX/2,
      y-5
    );
  }
}

function drawFeatures(chunk){
  const originX=chunk.cx*CHUNK_PX;
  const originY=chunk.cy*CHUNK_PX;

  for(const lot of chunk.lots){
    fillWorld(
      originX+lot.x*PX,
      originY+lot.y*PX,
      lot.w*PX,
      lot.h*PX,
      COLORS[lot.ground]
    );

    ctx.strokeStyle="rgba(10,12,11,.24)";

    ctx.strokeRect(
      screenX(originX+lot.x*PX),
      screenY(originY+lot.y*PX),
      lot.w*PX,
      lot.h*PX
    );
  }

  for(const building of chunk.buildings){
    drawBuildingShadow(
      originX,
      originY,
      building
    );
  }

  for(const building of chunk.buildings){
    drawFloor(
      originX,
      originY,
      building
    );
  }

  for(const [wallKey,type] of chunk.walls){
    const [x,y]=wallKey.split(",").map(Number);

    drawWallBlock(
      originX,
      originY,
      x,
      y,
      type
    );
  }

  for(const building of chunk.buildings){
    drawFacade(
      originX,
      originY,
      building
    );

    for(const door of building.doors){
      drawDoor(
        originX,
        originY,
        building,
        door
      );
    }
  }

  for(const prop of chunk.props){
    drawProp(originX,originY,prop);
  }
}

/* PROPS */

function drawProp(originX,originY,prop){
  const x=screenX(originX+prop.x*PX);
  const y=screenY(originY+prop.y*PX);
  const width=prop.w*PX;
  const height=prop.h*PX;

  if(prop.kind==="tree"){
    ctx.fillStyle="rgba(0,0,0,.32)";
    ctx.beginPath();
    ctx.ellipse(
      x+PX,
      y+PX,
      PX*1.3,
      PX*.75,
      0,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="#3b2c1e";

    ctx.fillRect(
      x+PX*.38,
      y+PX*.35,
      PX*.24,
      PX*.9
    );

    ctx.fillStyle="#203a21";
    ctx.beginPath();
    ctx.arc(
      x+PX*.5,
      y+PX*.1,
      PX*1.35,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="#3a603b";
    ctx.beginPath();
    ctx.arc(
      x+PX*.1,
      y-PX*.25,
      PX*.8,
      0,
      Math.PI*2
    );
    ctx.fill();

    return;
  }

  if(
    prop.kind==="car"||
    prop.kind==="policeCar"
  ){
    drawCar(
      x,
      y,
      width,
      height,
      prop.kind==="policeCar",
      prop
    );

    return;
  }

  if(prop.kind==="rug"||prop.kind==="mat"){
    ctx.fillStyle=
      prop.kind==="rug"
        ?"#55484b"
        :"#343636";

    ctx.fillRect(
      x+3,
      y+3,
      width-6,
      height-6
    );

    ctx.strokeStyle="#8b786b";

    ctx.strokeRect(
      x+6,
      y+6,
      width-12,
      height-12
    );

    return;
  }

  const colors={
    bed:"#776b5c",
    dresser:"#574432",
    sofa:"#5c5149",
    table:"#624d3a",
    kitchen:"#706958",
    mail:"#474b49",
    shelf:"#5b4938",
    counter:"#514334",
    cooler:"#647a7d",
    freezer:"#66787a",
    desk:"#554739",
    bench:"#67513c",
    evidence:"#4a4f47",
    locker:"#4c5658",
    bars:"#747b7c",
    dumpster:"#34413a"
  };

  const innerWidth=Math.max(3,width-6);
  const innerHeight=Math.max(3,height-6);

  ctx.fillStyle="rgba(0,0,0,.35)";

  ctx.fillRect(
    x+7,
    y+8,
    innerWidth,
    innerHeight
  );

  ctx.fillStyle=
    colors[prop.kind]||"#57504a";

  ctx.fillRect(
    x+3,
    y+3,
    innerWidth,
    innerHeight
  );

  ctx.fillStyle="rgba(255,255,255,.13)";

  ctx.fillRect(
    x+5,
    y+5,
    Math.max(2,innerWidth-4),
    3
  );

  ctx.strokeStyle="#17191a";

  ctx.strokeRect(
    x+3,
    y+3,
    innerWidth,
    innerHeight
  );

  if(prop.kind==="bed"){
    ctx.fillStyle="#c4b59b";

    ctx.fillRect(
      x+6,
      y+6,
      innerWidth-6,
      Math.min(10,innerHeight*.25)
    );

    ctx.fillStyle="#665d55";

    ctx.fillRect(
      x+6,
      y+Math.max(18,innerHeight*.45),
      innerWidth-6,
      3
    );
  }

  if(prop.kind==="sofa"){
    ctx.strokeStyle="#292523";
    ctx.beginPath();
    ctx.moveTo(x+width/2,y+5);
    ctx.lineTo(x+width/2,y+height-5);
    ctx.stroke();
  }

  if(prop.kind==="shelf"){
    ctx.fillStyle="#2c241d";

    for(let py=y+12;py<y+height-6;py+=12){
      ctx.fillRect(
        x+5,
        py,
        width-10,
        3
      );
    }
  }

  if(prop.kind==="bars"){
    ctx.fillStyle="#b0b6b4";

    for(let px=x+6;px<x+width-5;px+=6){
      ctx.fillRect(
        px,
        y+4,
        2,
        height-8
      );
    }
  }
}

function drawCar(x,y,width,height,police,prop){
  const palette=[
    "#51575a",
    "#69413c",
    "#394c47",
    "#555047",
    "#334d5b"
  ];

  const bodyColor=
    police
      ?"#d7dad5"
      :palette[
        hash(prop.x,prop.y,700)%palette.length
      ];

  ctx.fillStyle="rgba(0,0,0,.45)";

  ctx.fillRect(
    x+7,
    y+9,
    width-2,
    height-2
  );

  ctx.fillStyle="#151719";

  ctx.fillRect(
    x,
    y+8,
    width,
    height-16
  );

  ctx.fillStyle=bodyColor;

  ctx.fillRect(
    x+3,
    y+3,
    width-6,
    height-6
  );

  ctx.fillStyle="rgba(255,255,255,.2)";

  ctx.fillRect(
    x+6,
    y+5,
    width-12,
    3
  );

  ctx.fillStyle="#17252b";

  ctx.fillRect(
    x+7,
    y+height*.2,
    width-14,
    height*.22
  );

  ctx.fillRect(
    x+7,
    y+height*.56,
    width-14,
    height*.2
  );

  ctx.fillStyle="#8da5aa";

  ctx.fillRect(
    x+9,
    y+height*.21,
    width-18,
    3
  );

  ctx.fillStyle="#111";

  for(const wheelY of [12,height-22]){
    ctx.fillRect(
      x-2,
      y+wheelY,
      6,
      11
    );

    ctx.fillRect(
      x+width-4,
      y+wheelY,
      6,
      11
    );
  }

  ctx.fillStyle="#e2d6a0";
  ctx.fillRect(x+7,y+3,7,4);
  ctx.fillRect(x+width-14,y+3,7,4);

  ctx.fillStyle="#9b302d";
  ctx.fillRect(x+7,y+height-7,7,4);
  ctx.fillRect(x+width-14,y+height-7,7,4);

  if(police){
    ctx.fillStyle="#294567";

    ctx.fillRect(
      x+width/2-4,
      y+4,
      8,
      height-8
    );

    ctx.fillStyle="#b84641";

    ctx.fillRect(
      x+width/2-7,
      y+height/2-3,
      7,
      6
    );

    ctx.fillStyle="#3d6da7";

    ctx.fillRect(
      x+width/2,
      y+height/2-3,
      7,
      6
    );
  }
}

/* PLAYER */

function drawPlayer(){
  const x=Math.floor(SW/2);
  const y=Math.floor(SH/2);
  const scale=PX/18;

  const bob=
    player.moving
      ?Math.round(
        Math.sin(performance.now()*.018)
      )
      :0;

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);

  ctx.fillStyle="#0008";
  ctx.beginPath();
  ctx.ellipse(
    3,
    12,
    9,
    5,
    0,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.fillStyle="#292c30";
  ctx.fillRect(-6,2+bob,4,10);
  ctx.fillRect(2,2-bob,4,10);

  ctx.fillStyle="#48545a";
  ctx.fillRect(-7,-9,14,13);

  ctx.fillStyle="#68767b";
  ctx.fillRect(-6,-8,12,3);

  ctx.fillStyle="#9b7155";
  ctx.fillRect(-10,-7,3,10);
  ctx.fillRect(7,-7,3,10);

  ctx.fillStyle="#a77b5a";
  ctx.fillRect(-5,-17,10,9);

  ctx.fillStyle="#201b18";
  ctx.fillRect(-5,-19,10,4);

  ctx.restore();
}

function draw(){
  ctx.fillStyle="#090b0c";
  ctx.fillRect(0,0,SW,SH);

  const left=
    Math.floor((camera.x-SW/2)/CHUNK_PX)-1;

  const right=
    Math.floor((camera.x+SW/2)/CHUNK_PX)+1;

  const top=
    Math.floor((camera.y-SH/2)/CHUNK_PX)-1;

  const bottom=
    Math.floor((camera.y+SH/2)/CHUNK_PX)+1;

  const visible=[];

  for(let cy=top;cy<=bottom;cy++){
    for(let cx=left;cx<=right;cx++){
      visible.push(getChunk(cx,cy));
    }
  }

  for(const chunk of visible){
    drawBase(chunk);
    drawStreetDetails(chunk);
  }

  for(const chunk of visible){
    drawFeatures(chunk);
  }

  drawPlayer();
}

/* MENU */

const menu=document.querySelector("#menu");
const input=document.querySelector("#seed");
const continueButton=document.querySelector("#continue");

function resetPlayer(){
  player.x=ROAD*.5*PX;
  player.y=ROAD*.5*PX;
  player.stamina=100;

  camera.x=player.x;
  camera.y=player.y;

  for(const keyName in keys){
    keys[keyName]=false;
  }
}

function generateCity(){
  seedLabel=
    input.value.trim()||randomSeed();

  input.value=seedLabel;
  worldSeed=seedNumber(seedLabel);

  chunks.clear();
  resetPlayer();

  started=true;
  playing=true;

  menu.classList.add("hidden");
  document.body.classList.add("playing");

  continueButton.hidden=false;

  document.querySelector("#seedView").textContent=
    "SEED • "+seedLabel;

  try{
    localStorage.setItem(
      "wnd-seed",
      seedLabel
    );

    const url=new URL(location.href);
    url.searchParams.set("seed",seedLabel);

    history.replaceState(null,"",url);
  }catch{}
}

function openMenu(){
  if(!started)return;

  playing=false;

  menu.classList.remove("hidden");
  document.body.classList.remove("playing");
}

function resumeGame(){
  if(!started)return;

  playing=true;

  menu.classList.add("hidden");
  document.body.classList.add("playing");

  previousTime=performance.now();
}

function randomSeed(){
  const values=new Uint32Array(1);

  if(globalThis.crypto?.getRandomValues){
    globalThis.crypto.getRandomValues(values);
  }else{
    values[0]=Date.now();
  }

  return"NDC-"+
    values[0]
      .toString(36)
      .toUpperCase()
      .padStart(7,"0");
}

document.querySelector("#start").onclick=
  generateCity;

document.querySelector("#random").onclick=()=>{
  input.value=randomSeed();
  input.focus();
  input.select();
};

document.querySelector("#menuBtn").onclick=
  openMenu;

continueButton.onclick=resumeGame;

input.onkeydown=event=>{
  event.stopPropagation();

  if(event.key==="Enter"){
    generateCity();
  }
};

try{
  input.value=
    new URL(location.href).searchParams.get("seed")||
    localStorage.getItem("wnd-seed")||
    seedLabel;
}catch{
  input.value=seedLabel;
}

input.focus();
input.select();

/* MOBILE CONTROLS */

const joystick=document.querySelector("#joy");
const stick=document.querySelector("#stick");
const runButton=document.querySelector("#run");

let joystickPointer=null;

function moveJoystick(event){
  const bounds=joystick.getBoundingClientRect();

  const x=
    event.clientX-
    (bounds.left+bounds.width/2);

  const y=
    event.clientY-
    (bounds.top+bounds.height/2);

  const magnitude=Math.hypot(x,y);
  const limit=38;
  const scale=magnitude>limit?limit/magnitude:1;

  touchX=x*scale/limit;
  touchY=y*scale/limit;

  stick.style.transform=
    `translate(${x*scale}px,${y*scale}px)`;
}

joystick.addEventListener("pointerdown",event=>{
  joystickPointer=event.pointerId;
  joystick.setPointerCapture(event.pointerId);
  moveJoystick(event);
});

joystick.addEventListener("pointermove",event=>{
  if(event.pointerId===joystickPointer){
    moveJoystick(event);
  }
});

function stopJoystick(event){
  if(
    joystickPointer!==null&&
    (!event||event.pointerId===joystickPointer)
  ){
    joystickPointer=null;
    touchX=0;
    touchY=0;
    stick.style.transform="";
  }
}

joystick.addEventListener("pointerup",stopJoystick);
joystick.addEventListener("pointercancel",stopJoystick);

runButton.addEventListener("pointerdown",event=>{
  touchRun=true;
  runButton.setPointerCapture(event.pointerId);
});

runButton.addEventListener("pointerup",()=>{
  touchRun=false;
});

runButton.addEventListener("pointercancel",()=>{
  touchRun=false;
});

/* GAME LOOP */

let previousTime=performance.now();

function gameLoop(time){
  const deltaTime=Math.min(
    .05,
    (time-previousTime)/1000
  );

  previousTime=time;

  if(started){
    if(playing){
      update(deltaTime);
    }

    draw();
  }else{
    ctx.fillStyle="#090b0c";
    ctx.fillRect(0,0,SW,SH);
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
