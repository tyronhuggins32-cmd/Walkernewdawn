<script>

"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

const staminaBar =
document.getElementById("stamina");

const districtLabel =
document.getElementById("district");

let screenWidth=innerWidth;
let screenHeight=innerHeight;

function resize(){

    screenWidth=innerWidth;
    screenHeight=innerHeight;

    canvas.width=
        screenWidth *
        devicePixelRatio;

    canvas.height=
        screenHeight *
        devicePixelRatio;

    canvas.style.width=
        screenWidth+"px";

    canvas.style.height=
        screenHeight+"px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    ctx.imageSmoothingEnabled=false;
}

addEventListener(
    "resize",
    resize
);

resize();

/* =========================================================
   WORLD SETTINGS
========================================================= */

const WORLD_SEED=1987;

const CHUNK_SIZE=900;

/*
    Much wider than previous version.

    Each major road now has enough visual room
    for several marked lanes.
*/

const ROAD_WIDTH=176;

const SIDEWALK_WIDTH=42;

const CURB_WIDTH=5;

const VIEW_DISTANCE=2;

const WALL=8;

const chunkCache=
new Map();

/* =========================================================
   PLAYER
========================================================= */

const player={

    x:0,
    y:0,

    width:18,
    height:28,

    walkSpeed:180,
    sprintSpeed:275,

    stamina:100,
    maxStamina:100,

    direction:"down",

    moving:false
};

const camera={

    x:0,
    y:0
};

/* =========================================================
   KEYBOARD INPUT
========================================================= */

const keys={};

addEventListener(
    "keydown",
    event=>{
        keys[
            event.key.toLowerCase()
        ]=true;
    }
);

addEventListener(
    "keyup",
    event=>{
        keys[
            event.key.toLowerCase()
        ]=false;
    }
);

/* =========================================================
   MOBILE INPUT
========================================================= */

const joystickArea=
document.getElementById(
    "joystickArea"
);

const stick=
document.getElementById(
    "stick"
);

const sprintButton=
document.getElementById(
    "sprintButton"
);

let joystickPointer=null;

let joystickX=0;
let joystickY=0;

let sprintTouch=false;

joystickArea.addEventListener(
    "pointerdown",
    event=>{

        joystickPointer=
            event.pointerId;

        joystickArea
        .setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event
        );
    }
);

joystickArea.addEventListener(
    "pointermove",
    event=>{

        if(
            event.pointerId !==
            joystickPointer
        )
            return;

        updateJoystick(
            event
        );
    }
);

function stopJoystick(event){

    if(
        joystickPointer !== null &&
        event.pointerId !==
        joystickPointer
    )
        return;

    joystickPointer=null;

    joystickX=0;
    joystickY=0;

    stick.style.transform=
        "translate(0px,0px)";
}

joystickArea.addEventListener(
    "pointerup",
    stopJoystick
);

joystickArea.addEventListener(
    "pointercancel",
    stopJoystick
);

function updateJoystick(event){

    const rect=
        joystickArea
        .getBoundingClientRect();

    let dx=
        event.clientX -
        (
            rect.left +
            rect.width/2
        );

    let dy=
        event.clientY -
        (
            rect.top +
            rect.height/2
        );

    const maximum=40;

    const distance=
        Math.hypot(
            dx,
            dy
        );

    if(distance>maximum){

        dx=
            dx /
            distance *
            maximum;

        dy=
            dy /
            distance *
            maximum;
    }

    joystickX=
        dx /
        maximum;

    joystickY=
        dy /
        maximum;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}

sprintButton.addEventListener(
    "pointerdown",
    event=>{

        sprintTouch=true;

        sprintButton
        .setPointerCapture(
            event.pointerId
        );
    }
);

sprintButton.addEventListener(
    "pointerup",
    ()=>{
        sprintTouch=false;
    }
);

sprintButton.addEventListener(
    "pointercancel",
    ()=>{
        sprintTouch=false;
    }
);

/* =========================================================
   DETERMINISTIC RANDOM
========================================================= */

function hash(
    x,
    y,
    extra=0
){

    let h=

        WORLD_SEED ^

        Math.imul(
            x,
            374761393
        ) ^

        Math.imul(
            y,
            668265263
        ) ^

        Math.imul(
            extra,
            144269
        );

    h=
        Math.imul(
            h ^
            (
                h >>> 13
            ),
            1274126177
        );

    return(
        h ^
        (
            h >>> 16
        )
    ) >>> 0;
}

function random01(
    x,
    y,
    extra=0
){

    return(
        hash(
            x,
            y,
            extra
        ) /
        4294967295
    );
}

function randomRange(
    x,
    y,
    extra,
    minimum,
    maximum
){

    return(
        minimum +

        random01(
            x,
            y,
            extra
        ) *

        (
            maximum -
            minimum
        )
    );
}

function choose(
    x,
    y,
    extra,
    options
){

    return options[
        hash(
            x,
            y,
            extra
        ) %
        options.length
    ];
}

/* =========================================================
   BUILDING DATABASE
========================================================= */

const BUILDING_TYPES={

    rowhouse:{
        label:"ROW HOUSE",
        floor:"#5b5349",
        wall:"#272523",
        accent:"#8d775d"
    },

    apartment:{
        label:"APARTMENTS",
        floor:"#565351",
        wall:"#242424",
        accent:"#766e63"
    },

    market:{
        label:"MARKET",
        floor:"#625b4d",
        wall:"#292621",
        accent:"#b39a55"
    },

    pharmacy:{
        label:"PHARMACY",
        floor:"#5b625f",
        wall:"#202625",
        accent:"#76988b"
    },

    hardware:{
        label:"HARDWARE",
        floor:"#62574d",
        wall:"#292521",
        accent:"#b4774d"
    },

    diner:{
        label:"DINER",
        floor:"#665954",
        wall:"#2a2423",
        accent:"#a65b52"
    },

    clinic:{
        label:"CLINIC",
        floor:"#62645e",
        wall:"#232624",
        accent:"#8ca093"
    },

    warehouse:{
        label:"WAREHOUSE",
        floor:"#505255",
        wall:"#212326",
        accent:"#7b8185"
    },

    office:{
        label:"OFFICES",
        floor:"#565c5e",
        wall:"#222628",
        accent:"#718994"
    },

    station:{
        label:"CITY SERVICES",
        floor:"#5d5d58",
        wall:"#252622",
        accent:"#897b64"
    }
};

/* =========================================================
   CHUNKS
========================================================= */

function chunkKey(
    cx,
    cy
){

    return(
        cx +
        "," +
        cy
    );
}

function getChunk(
    cx,
    cy
){

    const key=
        chunkKey(
            cx,
            cy
        );

    if(
        !chunkCache
        .has(key)
    ){

        chunkCache.set(
            key,
            generateChunk(
                cx,
                cy
            )
        );
    }

    return(
        chunkCache
        .get(key)
    );
}

/* =========================================================
   CITY DISTRICTS
========================================================= */

function generateChunk(
    cx,
    cy
){

    const roll=
        random01(
            cx,
            cy,
            1
        );

    let type=
        "residential";

    if(roll < .08){

        type=
            "park";
    }

    else if(
        roll < .14
    ){

        type=
            "parking";
    }

    else if(
        roll < .19
    ){

        type=
            "civic";
    }

    else if(
        roll < .32
    ){

        type=
            "industrial";
    }

    else if(
        roll < .58
    ){

        type=
            "commercial";
    }

    const chunk={

        cx,
        cy,

        type,

        buildings:[],
        props:[],
        fences:[],
        trees:[]
    };

    if(
        type ===
        "park"
    ){

        generatePark(
            chunk
        );
    }

    else if(
        type ===
        "parking"
    ){

        generateParking(
            chunk
        );
    }

    else{

        generateLots(
            chunk
        );
    }

    generateStreetProps(
        chunk
    );

    return chunk;
}

/* =========================================================
   BUILDABLE AREA
========================================================= */

function getLotBounds(){

    const margin=

        ROAD_WIDTH/2 +

        SIDEWALK_WIDTH +

        18;

    return{

        min:margin,

        max:
            CHUNK_SIZE -
            margin,

        size:
            CHUNK_SIZE -
            margin*2
    };
}

/* =========================================================
   LOT GENERATION
========================================================= */

function generateLots(
    chunk
){

    const cx=
        chunk.cx;

    const cy=
        chunk.cy;

    const type=
        chunk.type;

    const bounds=
        getLotBounds();

    let columns=2;
    let rows=2;

    if(
        type ===
        "commercial"
    ){

        columns=3;
        rows=2;
    }

    if(
        type ===
        "industrial"
    ){

        columns=2;
        rows=2;
    }

    if(
        type ===
        "civic"
    ){

        columns=1;
        rows=1;
    }

    if(
        type ===
        "residential" &&

        random01(
            cx,
            cy,
            30
        ) > .55
    ){

        columns=3;
        rows=2;
    }

    const cellWidth=
        bounds.size /
        columns;

    const cellHeight=
        bounds.size /
        rows;

    let index=0;

    for(
        let gx=0;
        gx<columns;
        gx++
    ){

        for(
            let gy=0;
            gy<rows;
            gy++
        ){

            index++;

            const padding=
                randomRange(
                    cx,
                    cy,
                    100+index,
                    14,
                    30
                );

            const lot={

                x:
                    bounds.min +
                    gx *
                    cellWidth +
                    padding,

                y:
                    bounds.min +
                    gy *
                    cellHeight +
                    padding,

                w:
                    cellWidth -
                    padding*2,

                h:
                    cellHeight -
                    padding*2
            };

            /*
                Some lots become fenced
                utility/service areas.
            */

            if(
                random01(
                    cx,
                    cy,
                    200+index
                ) < .09
            ){

                generateServiceYard(
                    chunk,
                    lot
                );

                continue;
            }

            createBuildingForLot(
                chunk,
                lot,
                index
            );
        }
    }
}

/* =========================================================
   BUILDING TYPE
========================================================= */

function chooseBuildingType(
    district,
    cx,
    cy,
    index
){

    if(
        district ===
        "residential"
    ){

        return choose(
            cx,
            cy,
            300+index,
            [
                "rowhouse",
                "rowhouse",
                "apartment"
            ]
        );
    }

    if(
        district ===
        "commercial"
    ){

        return choose(
            cx,
            cy,
            300+index,
            [
                "market",
                "pharmacy",
                "hardware",
                "diner",
                "office"
            ]
        );
    }

    if(
        district ===
        "industrial"
    ){

        return choose(
            cx,
            cy,
            300+index,
            [
                "warehouse",
                "warehouse",
                "hardware",
                "office"
            ]
        );
    }

    if(
        district ===
        "civic"
    ){

        return choose(
            cx,
            cy,
            300+index,
            [
                "clinic",
                "station",
                "office"
            ]
        );
    }

    return "apartment";
}

/* =========================================================
   CREATE BUILDING
========================================================= */

function createBuildingForLot(
    chunk,
    lot,
    index
){

    const cx=
        chunk.cx;

    const cy=
        chunk.cy;

    const type=
        chooseBuildingType(
            chunk.type,
            cx,
            cy,
            index
        );

    let inset=
        randomRange(
            cx,
            cy,
            400+index,
            6,
            18
        );

    if(
        type ===
        "warehouse"
    ){

        inset=8;
    }

    const x=
        lot.x +
        inset;

    const y=
        lot.y +
        inset;

    const width=
        Math.max(
            90,
            lot.w -
            inset*2
        );

    const height=
        Math.max(
            80,
            lot.h -
            inset*2
        );

    const doorSide=
        hash(
            cx,
            cy,
            500+index
        ) % 4;

    const doorSize=26;

    const edgeLength=

        doorSide % 2 === 0

        ? width

        : height;

    const doorOffset=

        edgeLength *

        randomRange(
            cx,
            cy,
            520+index,
            .35,
            .65
        );

    const building={

        type,

        x,
        y,

        w:width,
        h:height,

        doorSide,
        doorSize,
        doorOffset,

        walls:[],
        interiorWalls:[],
        windows:[],
        props:[],

        sign:
            BUILDING_TYPES[
                type
            ].label
    };

    addOuterWalls(
        building
    );

    addInteriorPlan(
        building
    );

    addWindows(
        building,
        cx,
        cy,
        index
    );

    chunk.buildings.push(
        building
    );

    if(
        type ===
        "warehouse" ||

        type ===
        "hardware"
    ){

        chunk.props.push({

            kind:"dumpster",

            x:
                x +
                width -
                38,

            y:
                y +
                height*.72,

            w:26,
            h:16
        });
    }
}

/* =========================================================
   EXTERIOR WALLS + ENTERABLE DOORS
========================================================= */

function addOuterWalls(
    building
){

    const t=WALL;

    const gap=
        building.doorSize;

    const offset=
        building.doorOffset;

    const x=
        building.x;

    const y=
        building.y;

    const width=
        building.w;

    const height=
        building.h;

    /*
        TOP DOOR
    */

    if(
        building.doorSide === 0
    ){

        building.walls.push(

            {
                x:x,
                y:y,
                w:offset-gap/2,
                h:t
            },

            {
                x:
                    x +
                    offset +
                    gap/2,

                y:y,

                w:
                    width -
                    offset -
                    gap/2,

                h:t
            },

            {
                x:x,
                y:y,
                w:t,
                h:height
            },

            {
                x:
                    x +
                    width -
                    t,

                y:y,
                w:t,
                h:height
            },

            {
                x:x,
                y:
                    y +
                    height -
                    t,

                w:width,
                h:t
            }
        );
    }

    /*
        RIGHT DOOR
    */

    else if(
        building.doorSide === 1
    ){

        building.walls.push(

            {
                x:x,
                y:y,
                w:width,
                h:t
            },

            {
                x:x,

                y:
                    y +
                    height -
                    t,

                w:width,
                h:t
            },

            {
                x:x,
                y:y,
                w:t,
                h:height
            },

            {
                x:
                    x +
                    width -
                    t,

                y:y,

                w:t,

                h:
                    offset -
                    gap/2
            },

            {
                x:
                    x +
                    width -
                    t,

                y:
                    y +
                    offset +
                    gap/2,

                w:t,

                h:
                    height -
                    offset -
                    gap/2
            }
        );
    }

    /*
        BOTTOM DOOR
    */

    else if(
        building.doorSide === 2
    ){

        building.walls.push(

            {
                x:x,
                y:y,
                w:width,
                h:t
            },

            {
                x:x,
                y:y,
                w:t,
                h:height
            },

            {
                x:
                    x +
                    width -
                    t,

                y:y,

                w:t,
                h:height
            },

            {
                x:x,

                y:
                    y +
                    height -
                    t,

                w:
                    offset -
                    gap/2,

                h:t
            },

            {
                x:
                    x +
                    offset +
                    gap/2,

                y:
                    y +
                    height -
                    t,

                w:
                    width -
                    offset -
                    gap/2,

                h:t
            }
        );
    }

    /*
        LEFT DOOR
    */

    else{

        building.walls.push(

            {
                x:x,
                y:y,
                w:width,
                h:t
            },

            {
                x:x,

                y:
                    y +
                    height -
                    t,

                w:width,
                h:t
            },

            {
                x:
                    x +
                    width -
                    t,

                y:y,

                w:t,
                h:height
            },

            {
                x:x,
                y:y,
                w:t,

                h:
                    offset -
                    gap/2
            },

            {
                x:x,

                y:
                    y +
                    offset +
                    gap/2,

                w:t,

                h:
                    height -
                    offset -
                    gap/2
            }
        );
    }
}

/* =========================================================
   INTERIORS
========================================================= */

function addInteriorPlan(
    building
){

    const x=
        building.x;

    const y=
        building.y;

    const width=
        building.w;

    const height=
        building.h;

    const thickness=6;

    /*
        Warehouse shelves
    */

    if(
        building.type ===
        "warehouse"
    ){

        building
        .interiorWalls
        .push({

            x:
                x +
                width*.68,

            y:
                y +
                thickness,

            w:thickness,

            h:
                height*.55
        });

        building.props.push(

            {
                kind:"shelf",

                x:
                    x +
                    width*.16,

                y:
                    y +
                    height*.26,

                w:
                    width*.42,

                h:12
            },

            {
                kind:"shelf",

                x:
                    x +
                    width*.16,

                y:
                    y +
                    height*.47,

                w:
                    width*.42,

                h:12
            },

            {
                kind:"shelf",

                x:
                    x +
                    width*.16,

                y:
                    y +
                    height*.68,

                w:
                    width*.42,

                h:12
            }
        );

        return;
    }

    /*
        Store layouts
    */

    if(
        building.type ===
        "market" ||

        building.type ===
        "pharmacy" ||

        building.type ===
        "hardware"
    ){

        building
        .interiorWalls
        .push({

            x:
                x +
                width*.76,

            y:
                y +
                thickness,

            w:thickness,

            h:
                height*.34
        });

        for(
            let row=0;
            row<3;
            row++
        ){

            building.props.push({

                kind:"shelf",

                x:
                    x +
                    width*.18,

                y:
                    y +
                    height*
                    (
                        .28 +
                        row*.19
                    ),

                w:
                    width*.48,

                h:10
            });
        }

        building.props.push({

            kind:"counter",

            x:
                x +
                width*.58,

            y:
                y +
                height*.13,

            w:
                width*.25,

            h:12
        });

    /*

            w:thickness,

                        row*.22

            });

            y:

        });

    /*
        Apartments, offices and clinics
    */

    const vertical=

        x +
        width*.52;

    const horizontal=

        y +
        height*.52;

    building

    .push(

        {
            x:vertical,

            y:
                y +
                thickness,

            w:thickness,

            h:
                height*.34
        },

        {

                y +
                height*.46,

            w:thickness,

            h:
                height*.54 -
                thickness
        },

        {
            x:
                x +
                thickness,

            y:horizontal,

            w:
                width*.30,

            h:thickness
        },

        {

                x +
                width*.40,

            y:horizontal,

            w:
                width*.60 -

            h:thickness
        }

    if(
        building.type ===

        building.type ===
        "apartment"
    ){

        building.props.push(

            {
                kind:"bed",

                x:
                    x +

                y:
                    y +
                    height*.18,

                w:34,
                h:22
            },

            {

            },

                x:

                    width*.18,

                y:

                    height*.22,

                w:32,

}

/* =========================================================
   WINDOWS
========================================================= */

function addWindows(
    building,
    cx,
    cy,
    index
){

    const count=
        Math.max(
            2,

            Math.floor(
                (
                    building.w +
                    building.h
                ) /
                125
            )
        );

    for(
        let n=0;
        n<count;
        n++
    ){

        const side=

            hash(
                cx,
                cy,
                700+
                index*20+
                n
            ) % 4;

        const position=

            randomRange(
                cx,
                cy,
                710+
                index*20+
                n,
                .18,
                .82
            );

        if(side===0){

            building
            .windows
            .push({

                x:
                    building.x +
                    building.w*
                    position -
                    8,

                y:
                    building.y -
                    1,

                w:16,
                h:3
            });
        }

        if(side===1){

            building
            .windows
            .push({

                x:
                    building.x +
                    building.w -
                    2,

                y:
                    building.y +
                    building.h*
                    position -
                    8,

                w:3,
                h:16
            });
        }

        if(side===2){

            building
            .windows
            .push({

                x:
                    building.x +
                    building.w*
                    position -
                    8,

                y:
                    building.y +
                    building.h -
                    2,

                w:16,
                h:3
            });
        }

        if(side===3){

            building
            .windows
            .push({

                x:
                    building.x -
                    1,

                y:

                    building.h*
                    position -
                    8,

                w:3,
                h:16
            });
        }
    }

/* =========================================================
   COLLISION
========================================================= */

function worldToChunk(
    value
){

    return Math.floor(
        value /
        CHUNK_SIZE
    );
}

function intersects(
    playerBody,
    object
){

    return(

        playerBody.right >
        object.x &&

        playerBody.left <
        object.x +
        object.w &&

        playerBody.bottom >
        object.y &&

        playerBody.top <
        object.y +
        object.h
    );
}

function canMoveTo(
    x,
    y
){

    const body={

        left:
            x -
            player.width*.34,

        right:
            x +
            player.width*.34,

        top:
            y -
            player.height*.27,

        bottom:
            y +
            player.height*.27
    };

    const cx=
        worldToChunk(x);

    const cy=
        worldToChunk(y);

    for(
        let offsetX=-1;
        offsetX<=1;
        offsetX++
    ){

        for(
            let offsetY=-1;
            offsetY<=1;
            offsetY++
        ){

            const chunk=
                getChunk(
                    cx+offsetX,
                    cy+offsetY
                );

            const baseX=
                chunk.cx *
                CHUNK_SIZE;

            const baseY=
                chunk.cy *
                CHUNK_SIZE;

            for(
                const building
                of chunk.buildings
            ){

                for(
                    const wall
                    of building.walls
                ){

                    if(
                        intersects(
                            body,
                            {
                                x:
                                    baseX +
                                    wall.x,

                                y:
                                    baseY +
                                    wall.y,

                                w:
                                    wall.w,

                                h:
                                    wall.h
                            }
                        )
                    )
                        return false;
                }

                for(
                    const wall
                    of building
                    .interiorWalls
                ){

                    if(
                        intersects(
                            body,
                            {
                                x:
                                    baseX +
                                    wall.x,

                                y:
                                    baseY +
                                    wall.y,

                                w:
                                    wall.w,

                                h:
                                    wall.h
                            }
                        )
                    )
                        return false;
                }
            }

            for(
                const fence
                of chunk.fences
            ){

                if(
                    intersects(
                        body,
                        {
                            x:
                                baseX +
                                fence.x,

                            y:
                                baseY +
                                fence.y,

                            w:
                                fence.w,

                            h:
                                fence.h
                        }
                    )
                )
                    return false;
            }
        }
    }

    return true;
}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    let dx=0;
    let dy=0;

    if(
        keys["w"] ||
        keys["arrowup"]
    )
        dy--;

    if(
        keys["s"] ||
        keys["arrowdown"]
    )
        dy++;

    if(
        keys["a"] ||
        keys["arrowleft"]
    )
        dx--;

    if(
        keys["d"] ||
        keys["arrowright"]
    )
        dx++;

    dx+=joystickX;
    dy+=joystickY;

    const magnitude=
        Math.hypot(
            dx,
            dy
        );

    player.moving=
        magnitude>.05;

    if(
        magnitude>1
    ){

        dx/=magnitude;
        dy/=magnitude;
    }

    if(
        Math.abs(dx) >
        Math.abs(dy)
    ){

        if(dx>.05)
            player.direction=
                "right";

        if(dx<-.05)
            player.direction=
                "left";
    }

    else{

        if(dy>.05)
            player.direction=
                "down";

        if(dy<-.05)
            player.direction=
                "up";
    }

    const sprinting=

        (
            keys["shift"] ||
            sprintTouch
        ) &&

        player.moving &&

        player.stamina>0;

    const speed=

        sprinting

        ? player.sprintSpeed

        : player.walkSpeed;

    player.stamina +=

        (
            sprinting
            ? -22
            : 14
        ) *

        dt;

    player.stamina=
        Math.max(
            0,
            Math.min(
                player.maxStamina,
                player.stamina
            )
        );

    const nextX=

        player.x +
        dx *
        speed *
        dt;

    if(
        canMoveTo(
            nextX,
            player.y
        )
    ){

        player.x=
            nextX;
    }

    const nextY=

        player.y +
        dy *
        speed *
        dt;

    if(
        canMoveTo(
            player.x,
            nextY
        )
    ){

        player.y=
            nextY;
    }

    staminaBar.style.width=

        (
            player.stamina /
            player.maxStamina *
            100
        ) +
        "%";

    const chunk=
        getChunk(
            worldToChunk(
                player.x
            ),

            worldToChunk(
                player.y
            )
        );

    districtLabel.textContent=

        chunk.type
        .toUpperCase() +

        " BLOCK";
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

    const smoothing=
        Math.min(
            1,
            dt*7
        );

    camera.x +=

        (
            player.x -
            camera.x
        ) *

        smoothing;

    camera.y +=

        (
            player.y -
            camera.y
        ) *

        smoothing;
}

/* =========================================================
   DRAW HELPERS
========================================================= */

function screenX(
    worldX
){

    return(

        worldX -
        camera.x +
        screenWidth/2
    );
}

function screenY(
    worldY
){

    return(

        worldY -
        camera.y +
        screenHeight/2
    );
}

function fillWorld(
    x,
    y,
    width,
    height,
    color
){

    ctx.fillStyle=
        color;

    ctx.fillRect(

        Math.floor(
            screenX(x)
        ),

        Math.floor(
            screenY(y)
        ),

        Math.ceil(width),

        Math.ceil(height)
    );
}

function strokeWorld(
    x,
    y,
    width,
    height,
    color
){

    ctx.strokeStyle=
        color;

    ctx.lineWidth=1;

    ctx.strokeRect(

        Math.floor(
            screenX(x)
        ),

        Math.floor(
            screenY(y)
        ),

        width,
        height
    );
}

/* =========================================================
   DRAW CHUNK
========================================================= */

function drawChunk(
    chunk
){

    const baseX=

        chunk.cx *
        CHUNK_SIZE;

    const baseY=

        chunk.cy *
        CHUNK_SIZE;

    fillWorld(
        baseX,
        baseY,
        CHUNK_SIZE,
        CHUNK_SIZE,
        "#242627"
    );

    drawRoads(
        baseX,
        baseY
    );

    drawLotGround(
        chunk,
        baseX,
        baseY
    );

    for(
        const building
        of chunk.buildings
    ){

        drawBuilding(
            building,
            baseX,
            baseY
        );
    }

    for(
        const fence
        of chunk.fences
    ){

        drawFence(
            fence,
            baseX,
            baseY
        );
    }

    for(
        const prop
        of chunk.props
    ){

        drawProp(
            prop,
            baseX,
            baseY
        );
    }

    for(
        const tree
        of chunk.trees
    ){

        drawTree(
            tree,
            baseX,
            baseY
        );
    }
}

/* =========================================================
   WIDE STREETS
========================================================= */

function drawRoads(
    baseX,
    baseY
){

    const half=
        ROAD_WIDTH/2;

    /*
        Vertical road
    */

    fillWorld(
        baseX-half,
        baseY,
        ROAD_WIDTH,
        CHUNK_SIZE,
        "#151719"
    );

    /*
        Horizontal road
    */

    fillWorld(
        baseX,
        baseY-half,
        CHUNK_SIZE,
        ROAD_WIDTH,
        "#151719"
    );

    /*
        Sidewalks on both sides
        of vertical street
    */

    fillWorld(
        baseX+half,
        baseY,
        SIDEWALK_WIDTH,
        CHUNK_SIZE,
        "#66645f"
    );

    fillWorld(
        baseX-half-SIDEWALK_WIDTH,
        baseY,
        SIDEWALK_WIDTH,
        CHUNK_SIZE,
        "#66645f"
    );

    /*
        Sidewalks on both sides
        of horizontal street
    */

    fillWorld(
        baseX,
        baseY+half,
        CHUNK_SIZE,
        SIDEWALK_WIDTH,
        "#66645f"
    );

    fillWorld(
        baseX,
        baseY-half-SIDEWALK_WIDTH,
        CHUNK_SIZE,
        SIDEWALK_WIDTH,
        "#66645f"
    );

    /*
        Curbs
    */

    fillWorld(
        baseX+half,
        baseY,
        CURB_WIDTH,
        CHUNK_SIZE,
        "#8a877e"
    );

    fillWorld(
        baseX-half-CURB_WIDTH,
        baseY,
        CURB_WIDTH,
        CHUNK_SIZE,
        "#8a877e"
    );

    fillWorld(
        baseX,
        baseY+half,
        CHUNK_SIZE,
        CURB_WIDTH,
        "#8a877e"
    );

    fillWorld(
        baseX,
        baseY-half-CURB_WIDTH,
        CHUNK_SIZE,
        CURB_WIDTH,
        "#8a877e"
    );

    /*
        Center yellow markings
    */

    for(
        let i=120;
        i<CHUNK_SIZE;
        i+=95
    ){

        fillWorld(
            baseX-2,
            baseY+i,
            4,
            42,
            "#b0a65f"
        );

        fillWorld(
            baseX+i,
            baseY-2,
            42,
            4,
            "#b0a65f"
        );
    }

    /*
        Lane separators
    */

    fillWorld(
        baseX-half*.52,
        baseY,
        2,
        CHUNK_SIZE,
        "#77766c"
    );

    fillWorld(
        baseX+half*.52,
        baseY,
        2,
        CHUNK_SIZE,
        "#77766c"
    );

    fillWorld(
        baseX,
        baseY-half*.52,
        CHUNK_SIZE,
        2,
        "#77766c"
    );

    fillWorld(
        baseX,
        baseY+half*.52,
        CHUNK_SIZE,
        2,
        "#77766c"
    );

    /*
        Crosswalk
    */

    for(
        let i=0;
        i<6;
        i++
    ){

        fillWorld(
            baseX+
            half+
            12+
            i*12,

            baseY+
            half-
            30,

            7,
            27,
            "#b8b8ad"
        );

        fillWorld(
            baseX+
            half-
            30,

            baseY+
            half+
            12+
            i*12,

            27,
            7,
            "#b8b8ad"
        );
    }
}

/* =========================================================
   BUILDINGS
========================================================= */

function drawBuilding(
    building,
    baseX,
    baseY
){

    const palette=

        BUILDING_TYPES[
            building.type
        ];

    const x=
        baseX+
        building.x;

    const y=
        baseY+
        building.y;

    /*
        Shadow
    */

    fillWorld(

        x-5,
        y+6,

        building.w,
        building.h,

        "rgba(0,0,0,.45)"
    );

    /*
        Interior floor
    */

    fillWorld(

        x,
        y,

        building.w,
        building.h,

        palette.floor
    );

    /*
        Tile grid
    */

    ctx.globalAlpha=.12;

    for(
        let gx=16;
        gx<building.w;
        gx+=24
    ){

        fillWorld(
            x+gx,
            y,
            1,
            building.h,
            "#111"
        );
    }

    for(
        let gy=16;
        gy<building.h;
        gy+=24
    ){

        fillWorld(
            x,
            y+gy,
            building.w,
            1,
            "#111"
        );
    }

    ctx.globalAlpha=1;

    /*
        Exterior walls
    */

    for(
        const wall
        of building.walls
    ){

        fillWorld(

            baseX+
            wall.x,

            baseY+
            wall.y,

            wall.w,
            wall.h,

            palette.wall
        );
    }

    /*
        Interior walls
    */

    for(
        const wall
        of building
        .interiorWalls
    ){

        fillWorld(

            baseX+
            wall.x,

            baseY+
            wall.y,

            wall.w,
            wall.h,

            "#3a3936"
        );
    }

    /*
        Windows
    */

    for(
        const windowPart
        of building.windows
    ){

        fillWorld(

            baseX+
            windowPart.x,

            baseY+
            windowPart.y,

            windowPart.w,
            windowPart.h,

            "#7da0a4"
        );
    }

    /*
        Door opening marker
    */

    let doorX=x;
    let doorY=y;

    let doorWidth=0;
    let doorHeight=0;

    if(
        building.doorSide===0
    ){

        doorX=

            x+
            building.doorOffset-
            building.doorSize/2;

        doorY=y-2;

        doorWidth=
            building.doorSize;

        doorHeight=6;
    }

    if(
        building.doorSide===1
    ){

        doorX=
            x+
            building.w-
            4;

        doorY=

            y+
            building.doorOffset-
            building.doorSize/2;

        doorWidth=6;

        doorHeight=
            building.doorSize;
    }

    if(
        building.doorSide===2
    ){

        doorX=

            x+
            building.doorOffset-
            building.doorSize/2;

        doorY=

            y+
            building.h-
            4;

        doorWidth=
            building.doorSize;

        doorHeight=6;
    }

    if(
        building.doorSide===3
    ){

        doorX=x-2;

        doorY=

            y+
            building.doorOffset-
            building.doorSize/2;

        doorWidth=6;

        doorHeight=
            building.doorSize;
    }

    fillWorld(

        doorX,
        doorY,

        doorWidth,
        doorHeight,

        palette.accent
    );

    /*
        Furniture
    */

    for(
        const prop
        of building.props
    ){

        drawInteriorProp(
            prop,
            baseX,
            baseY
        );
    }

    /*
        Building type label
    */

    const textX=
        screenX(
            x+
            building.w/2
        );

    const textY=
        screenY(
            y+15
        );

    if(
        textX>-100 &&
        textX<screenWidth+100 &&
        textY>-30 &&
        textY<screenHeight+30
    ){

        ctx.fillStyle=
            palette.accent;

        ctx.font=
            "bold 9px Arial";

        ctx.textAlign=
            "center";

        ctx.fillText(

            building.sign,

            textX,
            textY
        );
    }
}

/* =========================================================
   INTERIOR OBJECTS
========================================================= */

function drawInteriorProp(
    prop,
    baseX,
    baseY
){

    const colors={

        shelf:"#40372e",

        counter:"#4b4033",

        table:"#554636",

        bed:"#6e6257",

        sofa:"#514b44",

        desk:"#4a4138"
    };

    fillWorld(

        baseX+
        prop.x,

        baseY+
        prop.y,

        prop.w,
        prop.h,

        colors[
            prop.kind
        ] ||
        "#4b443b"
    );

    strokeWorld(

        baseX+
        prop.x,

        baseY+
        prop.y,

        prop.w,
        prop.h,

        "rgba(0,0,0,.35)"
    );
}

/* =========================================================
   FENCES
========================================================= */

function drawFence(
    fence,
    baseX,
    baseY
){

    fillWorld(

        baseX+
        fence.x,

        baseY+
        fence.y,

        fence.w,
        fence.h,

        "#77786f"
    );

    if(
        fence.w >
        fence.h
    ){

        for(
            let x=4;
            x<fence.w;
            x+=14
        ){

            fillWorld(

                baseX+
                fence.x+
                x,

                baseY+
                fence.y,

                2,
                fence.h,

                "#9a9b91"
            );
        }
    }

    else{

        for(
            let y=4;
            y<fence.h;
            y+=14
        ){

            fillWorld(

                baseX+
                fence.x,

                baseY+
                fence.y+
                y,

                fence.w,
                2,

                "#9a9b91"
            );
        }
    }
}

/* =========================================================
   WORLD PROPS
========================================================= */

function drawProp(
    prop,
    baseX,
    baseY
){

    const x=
        baseX+
        prop.x;

    const y=
        baseY+
        prop.y;

    if(
        prop.kind ===
        "car"
    ){

        fillWorld(
            x-3,
            y+4,
            prop.w,
            prop.h,
            "rgba(0,0,0,.35)"
        );

        fillWorld(
            x,
            y,
            prop.w,
            prop.h,
            prop.tint
        );

        fillWorld(
            x+6,
            y+14,
            prop.w-12,
            18,
            "#1b2428"
        );

        fillWorld(
            x+6,
            y+prop.h-31,
            prop.w-12,
            18,
            "#1b2428"
        );

        return;
    }

    const colors={

        dumpster:"#334b3b",

        crate:"#705537",

        hydrant:"#8e3d32",

        trash:"#303336",

        bench:"#665038"
    };

    fillWorld(

        x,
        y,

        prop.w,
        prop.h,

        colors[
            prop.kind
        ] ||
        "#555"
    );
}

/* =========================================================
   TREES
========================================================= */

function drawTree(
    tree,
    baseX,
    baseY
){

    const x=
        screenX(
            baseX+
            tree.x
        );

    const y=
        screenY(
            baseY+
            tree.y
        );

    ctx.fillStyle=
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.arc(
        x+4,
        y+5,
        tree.size/2,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle=
        "#355d35";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        tree.size/2,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle=
        "#496f42";

    ctx.beginPath();

    ctx.arc(
        x-5,
        y-5,
        tree.size*.28,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* =========================================================
   PLAYER SPRITE
========================================================= */

function drawPlayer(){

    const x=
        Math.floor(
            screenWidth/2
        );

    const y=
        Math.floor(
            screenHeight/2
        );

    ctx.fillStyle=
        "rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+13,
        10,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        Legs
    */

    ctx.fillStyle=
        "#25292d";

    ctx.fillRect(
        x-7,
        y+4,
        5,
        11
    );

    ctx.fillRect(
        x+2,
        y+4,
        5,
        11
    );

    /*
        Shirt
    */

    ctx.fillStyle=
        "#46515a";

    ctx.fillRect(
        x-9,
        y-9,
        18,
        16
    );

    /*
        Head
    */

    ctx.fillStyle=
        "#a77958";

    ctx.fillRect(
        x-6,
        y-19,
        12,
        11
    );

    /*
        Hair
    */

    ctx.fillStyle=
        "#201c19";

    ctx.fillRect(
        x-6,
        y-20,
        12,
        4
    );

    /*
        Facing marker
    */

    ctx.fillStyle=
        "#d2d0bd";

    let faceX=x;
    let faceY=y;

    if(
        player.direction ===
        "up"
    )
        faceY-=25;

    if(
        player.direction ===
        "down"
    )
        faceY+=21;

    if(
        player.direction ===
        "left"
    )
        faceX-=15;

    if(
        player.direction ===
        "right"
    )
        faceX+=15;

    ctx.fillRect(
        faceX-2,
        faceY-2,
        4,
        4
    );
}

/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld(){

    ctx.fillStyle=
        "#0f1112";

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );

    const chunkX=
        worldToChunk(
            camera.x
        );

    const chunkY=
        worldToChunk(
            camera.y
        );

    for(
        let x=-VIEW_DISTANCE;
        x<=VIEW_DISTANCE;
        x++
    ){

        for(
            let y=-VIEW_DISTANCE;
            y<=VIEW_DISTANCE;
            y++
        ){

            drawChunk(

                getChunk(
                    chunkX+x,
                    chunkY+y
                )
            );
        }
    }

    drawPlayer();
}

/* =========================================================
   GAME LOOP
========================================================= */

let previousTime=
performance.now();

function gameLoop(time){

    const dt=
        Math.min(
            .05,

            (
                time-
                previousTime
            ) /
            1000
        );

    previousTime=time;

    updatePlayer(dt);

    updateCamera(dt);

    drawWorld();

    requestAnimationFrame(
        gameLoop
    );
}

requestAnimationFrame(
    gameLoop
);

</script>
